      </div>
      <label id="lkAgreeRow" class="agree-row ${termsRead?'':'locked'}" onclick="return agreeClick(event)">
        <input type="checkbox" id="lkAgree" style="width:20px;height:20px;flex-shrink:0;margin-top:1px;accent-color:#0a0a0a;cursor:pointer">
        <span>${TERMS_TITLE}を最後まで読み、同意します。</span>
      </label>
    </div>
    <div style="height:16px"></div>
    <button class="btn" id="lkBtn" onclick="linkAccount()">登録する</button>
    <div id="lkMsg" class="msg"></div>
  </div>`;
}
async function linkAccount(){
  const msg=(t,k)=>{const e=document.getElementById('lkMsg');e.textContent=t;e.className='msg '+(t?('show '+k):'');};
  const email=document.getElementById('lkEmail').value.trim();
  const pass=document.getElementById('lkPass').value;
  if(!email){ msg('メールアドレスを入力してください','err'); return; }
  if(pass.length<6){ msg('パスワードは6文字以上にしてください','err'); return; }
  if(!document.getElementById('lkAgree').checked){ msg(TERMS_TITLE+'をご確認の上、同意にチェックを入れてください','err'); return; }
  const btn=document.getElementById('lkBtn');
  btn.disabled=true;
  msg('','');
  try{
    const { error } = await sb.auth.linkEmailPassword({email,password:pass});
    if(error) throw new Error(error.message);
    /* ゲスト扱いをやめて、ふつうの会員と同じ画面にする（予約はもう入っている） */
    const now=new Date().toISOString();
    const { error:e2 } = await sb.from('profiles')
      .update({guest:false,booked_once:true,terms_agreed_at:now}).eq('id',me.id);
    if(e2) throw new Error(e2.message);
    profile.guest=false; profile.booked_once=true; profile.terms_agreed_at=now;
    if(!DEMO) saveMailAddress(me.id,email);
    curTab='mine';
    buildTabs();
    render();
    toast('登録しました。次回からログインできます');
  }catch(err){
    btn.disabled=false;
    msg(translateErr(String((err&&err.message)||err)),'err');
  }
}

      if(!mineC && !past && !blockedFor(blocks,h,selTrainer) && rs.length>here.length){ html+=cell('taken','予約あり'); return; }
      if(!mineC && isClassCourse(curCourse)){
        if(past){ html+=cell('taken','受付終了'); return; }
        if(allBlocked(blocks,h)){ html+=cell('taken',blockedAll(blocks,h)?'お休み':'予約不可'); return; }
        const n=here.reduce((a,r)=>a+partyOf(r),0), cap=courseCap(curCourse);
        html+= n>=cap ? cell('taken','満員') : cell('open',`空き<br>あと${cap-n}名`,`onclick="openReserve('${selDate}',${h})"`);
        return;
      }
    }
    /* 自分が入っている予約（予約者でも相乗りでも） */
    const mine=rs.find(r=>[r.user_id,...(r.reservation_participants||[]).map(p=>p.user_id)].includes(me.id));
    if(mine){
      html+=`<div class="slot mine"><div class="t">${hhmm(h)}</div><div class="s">予約済み${mine.trainer_id?'<br>'+esc(trainerName(mine.trainer_id)):''}</div></div>`;
      return;
    }
    if(past){ html+=`<div class="slot taken"><div class="t">${hhmm(h)}</div><div class="s">受付終了</div></div>`; return; }
    /* トレーナーがとめた枠 */
    if(blockedFor(blocks,h,selTrainer)){
      html+=`<div class="slot taken"><div class="t">${hhmm(h)}</div><div class="s">${blockedAll(blocks,h)?'お休み':'予約不可'}</div></div>`; return;
    }
    /* 仲間の予約（同じグループ・満員でない）。担当を選んでいるときはその担当の予約だけ */
    const joinable=rs.find(r=>r.group_id && myGroups.includes(r.group_id)
      && partyOf(r)+(r.reservation_participants||[]).length<SETTINGS.maxParty
      && (!selTrainer || r.trainer_id===selTrainer));
    if(joinable){
      const cnt=partyOf(joinable)+(joinable.reservation_participants||[]).length;
      html+=`<div class="slot joinable" onclick="openJoin('${joinable.id}',${h})">
        <div class="t">${hhmm(h)}</div><div class="s">参加可 ${cnt}/${SETTINGS.maxParty}</div></div>`;
    }else if(slotOpen(rs,selTrainer,null,blockedIds(blocks,h))){
      html+=`<div class="slot open" onclick="openReserve('${selDate}',${h})">
        <div class="t">${hhmm(h)}</div><div class="s">空き</div></div>`;
    }else{
      html+=`<div class="slot taken"><div class="t">${hhmm(h)}</div><div class="s">予約あり</div></div>`;
    }
  });
  html+=`</div></div>
    <p class="small">${(!MEMBER_PICKS_TRAINER||trialAvailable())
      ?'担当は、お店で決めさせていただきます。'
      :'担当を選ぶとその担当の空き時間、「指名なし」はどなたかが空いている時間が表示されます。'}${USE_GROUPS?`<br>点線枠＝あなたのグループ仲間の予約。タップで相乗り参加できます（最大${SETTINGS.maxParty}名）。`:''}</p>`;
  document.getElementById('screen').innerHTML=html;
}

async function getMyGroupIds(){
  const { data } = await sb.from('group_members').select('group_id').eq('user_id',me.id);
  return (data||[]).map(g=>g.group_id);
}

/* 1回の予約の人数。人数の記録が無い古い予約は1名 */
function partyOf(r){ return Math.max(1, parseInt(r && r.party) || 1); }
/* n名で予約したときに引くチケット。config.js の guestTicket(お連れ様1名あたりの枚数)で決まる */
function ticketCost(n){
  const g = (typeof SHOP.guestTicket === 'number') ? SHOP.guestTicket : 1;
  return 1 + (n - 1) * g;
}
/* その予約で使ったチケット。記録が無い古い予約は1枚 */
function usedOf(r){ return (r && r.tickets_used != null) ? r.tickets_used : 1; }
/* お連れ様の表示。名前が無い人は人数だけ出す */
function guestLine(r){
  const n = partyOf(r) - 1;
  if(n < 1) return '';
  const names = (r.guests || []).filter(Boolean).map(esc);
  const rest = n - names.length;
  const tail = rest > 0 ? (names.length ? `、ほか${rest}名` : `${rest}名（お名前なし）`) : '';
  return `<div class="meta">お連れ様：${names.join('、')}${tail}</div>`;
}

/* ---------- コース（カレンダーの切り替え） ----------
   config.js の courses に2つ以上書くと、予約の画面でカレンダーを切り替えられる。
   会員とトレーナーは共通。片方に予約が入った時間は、もう片方では取れない。
   チケットはコースごとに別で、1つ目は profiles.tickets、2つ目は tickets2 に持つ。
   capacity を2以上にしたコースはクラス形式で、同じ時間に定員まで別々の会員が予約できる。
   1つ目のコースの予約・履歴には course を書かない（コースを使わない店舗のデータと同じ形にする） */
const COURSES = Array.isArray(SHOP.courses) ? SHOP.courses : [];
const USE_COURSES = COURSES.length > 1;
const DEFAULT_COURSE = COURSES.length ? COURSES[0].id : '';
let curCourse = DEFAULT_COURSE;   /* いま見ている（予約を入れる）コース */
let calCourse = 'all';            /* トレーナーの予約状況で表示するコース */
function courseOf(id){ return COURSES.find(c=>c.id===id) || COURSES[0] || null; }
function courseIdOf(x){ return (x && x.course) || DEFAULT_COURSE; }
function courseName(id){ const c=courseOf(id); return c ? c.name : ''; }
function courseCap(id){ const c=courseOf(id); return (USE_COURSES && c) ? (parseInt(c.capacity)||1) : 1; }
function isClassCourse(id){ return courseCap(id) > 1; }
/* 予約・履歴に付ける印。1つ目のコースには付けない */
function courseTag(id){ return (USE_COURSES && id && id!==DEFAULT_COURSE) ? {course:id} : {}; }
/* そのコースのチケットを持つ欄の名前 */
function tkField(id){ const i=USE_COURSES?COURSES.findIndex(c=>c.id===id):0; return i>0 ? 'tickets'+(i+1) : 'tickets'; }
function tkOf(p,id){ return Number(p && p[tkField(id)]) || 0; }
function histOf(hist,id){ return USE_COURSES ? (hist||[]).filter(h=>courseIdOf(h)===id) : (hist||[]); }
function coursePill(x){ return USE_COURSES ? `<span class="pill">${esc(courseName(courseIdOf(x)))}</span>` : ''; }
function courseChips(sel,onPick,withAll){
  const chip=(id,label)=>`<span class="chip ${sel===id?'sel':''}" onclick="${onPick}('${id}')">${esc(label)}</span>`;
  return (withAll?chip('all','すべて'):'')+COURSES.map(c=>chip(c.id,c.name)).join('');
}
function pickCourse(id){ curCourse=id; render(); }
function pickCalCourse(id){ calCourse=id; if(id!=='all') curCourse=id; render(); }
function pickNewCourse(id){ curCourse=id; openAdminNew(selDate); }
function calCourseMatch(r){ return !USE_COURSES || calCourse==='all' || courseIdOf(r)===calCourse; }
/* カレンダーのラベルの色。コースに color があればそれ、無ければ担当の色 */
function evColor(r){ const c=USE_COURSES?courseOf(courseIdOf(r)):null; return (c&&c.color) || trainerColorOf(r.trainer_id); }
/* その時間が、担当の休みも含めてすべてとまっているか */
function allBlocked(blocks,h){
  if(blockedAll(blocks,h)) return true;
  const l=activeTrainers(), ids=blockedIds(blocks,h);
  return l.length>0 && l.every(t=>ids.has(t.id));
}
/* その時間の予約 rs に、コース cid の予約をもう1件入れられるか。
   コースを使わない店舗は slotFree と同じ */
function slotOpen(rs,trainerId,excludeId,blocked,cid){
  if(!USE_COURSES) return slotFree(rs,trainerId,excludeId,blocked);
  cid=cid||curCourse;
  const list=(rs||[]).filter(r=>!excludeId||r.id!==excludeId);
  /* 別のコースの予約が入っている時間は取れない */
  if(list.some(r=>courseIdOf(r)!==cid)) return false;
  if(isClassCourse(cid)){
    const l=activeTrainers();
    if(blocked && l.length && l.every(t=>blocked.has(t.id))) return false;
    return list.reduce((a,r)=>a+partyOf(r),0) < courseCap(cid);
  }
  return slotFree(list,trainerId,null,blocked);
}

/* ---------- 店舗 ----------
   config.js の stores に2つ以上書くと、店舗ごとに予約枠を分けて管理する。
   予約・トレーナー・会員・お休みには store（店舗の id）を持たせる。
   店舗が決まっていない古いデータは、1つ目の店舗のものとして扱う */
const STORES = Array.isArray(SHOP.stores) ? SHOP.stores : [];
const USE_STORES = STORES.length > 1;
const DEFAULT_STORE = STORES.length ? STORES[0].id : '';
let curStore = DEFAULT_STORE;   /* いま見ている店舗 */
function storeOf(id){ return STORES.find(s=>s.id===id) || null; }
function storeName(id){ const s=storeOf(id); return s ? s.name : '店舗未設定'; }
/* その行がどの店舗のものか。未設定は1つ目の店舗として扱う */
function storeIdOf(x){ return (x && x.store) || DEFAULT_STORE; }
/* いま見ている店舗のものだけ残す */
function inStore(list){
  if(!USE_STORES) return list||[];
  return (list||[]).filter(x=>storeIdOf(x)===curStore);
}
/* 店舗を選ぶチップ */
function storeChips(sel,onPick){
  return STORES.map(s=>`<span class="chip ${sel===s.id?'sel':''}" onclick="${onPick}('${s.id}')">${esc(s.name)}</span>`).join('');
}
function pickStore(id){ curStore=id; render(); }
/* 店舗を選ぶカード（写真・店舗名・住所） */
function storeCard(st,sel,onPick){
  const fn=onPick||'pickGuestStore';
  return `<button type="button" class="store-card ${sel?'sel':''}" data-s="${st.id}" onclick="${fn}('${st.id}')">
    ${st.photo?`<img src="${esc(st.photo)}" alt="" loading="lazy">`:''}
    <div class="sc-body">
      <div class="sc-name">${esc(st.name)}</div>
      ${st.address?`<div class="sc-addr">${esc(st.address)}</div>`:''}
    </div>
  </button>`;
}
/* 地図のリンクだけ（設定してあるときだけ出す） */
function storeMapLink(id){
  const s=storeOf(id);
  return (s&&s.map)?`<a href="${esc(s.map)}" target="_blank" rel="noopener" style="text-decoration:underline">${esc(s.name)}の地図を開く</a>`:'';
}
/* 店舗の案内。設定してあるものだけ出す */
function storeInfoLine(id){
  const s=storeOf(id); if(!s) return '';
  let h='';
  if(s.address) h+=`<div class="small" style="margin-top:6px">${esc(s.address)}</div>`;
  if(s.map) h+=`<a class="small" href="${esc(s.map)}" target="_blank" rel="noopener" style="text-decoration:underline">地図を開く</a>`;
  return h;
}
/* 会員・トレーナーの所属店舗を変える（トレーナーのみ） */
async function setMemberStore(uid,sid){
  const { error } = await sb.from('profiles').update({store:sid}).eq('id',uid);
  if(error){ toast('エラー: '+(error.message||'変更できませんでした')); return; }
  if(me && uid===me.id){ profile.store=sid; curStore=sid; await loadTrainers(); }
  toast(`${storeName(sid)}にしました`);
  /* 一覧の人数や並びも変わるので、画面を作り直す */

}

/* ---------- 担当トレーナー ----------
   role が admin のプロフィールがトレーナー。予約の trainer_id に担当を持つ（null は指名なし）。
   枠はトレーナーごと：同じ時間に別のトレーナーが別の会員を担当できる */
let TRAINERS=[];
let selTrainer=null;   /* 会員の予約画面で選んでいる担当。null は指名なし */
/* 会員が担当トレーナーを選べるか。false の店舗では、予約は担当なしで入り、
   トレーナーが管理画面（予約をタップ → 担当を変更する）で決める */
const MEMBER_PICKS_TRAINER = SHOP.memberPicksTrainer !== false;
/* トレーナーが1人だけの店舗か。config.js で singleTrainer を true にすると、
   予約は自動でそのトレーナーの担当になり、「担当未定」「指名なし」や担当を選ぶ欄を出さない */
const SINGLE_TRAINER = SHOP.singleTrainer === true;
function soleTrainerId(){ const l=activeTrainers(); return (SINGLE_TRAINER && l.length) ? l[0].id : null; }
/* 予約のときに「次に鍛えたい部位」のボタンを出すか。false ならメモ欄だけ */
const USE_BODY_PARTS = SHOP.bodyParts !== false;
const TRAINER_COLORS=(SHOP.trainerColors&&SHOP.trainerColors.length)?SHOP.trainerColors
  :['#E0605E','#F2994A','#F2C94C','#6FCF97','#4EB8A6','#5B9BF0','#7B7FD9','#B76ED0','#EF7AA6','#A38B7B'];
async function loadTrainers(){
  const { data } = await sb.from('profiles').select('*').eq('role','admin').order('name');
  TRAINERS=(data||[]).map((t,i)=>({id:t.id,name:t.name,color:t.color||TRAINER_COLORS[i%TRAINER_COLORS.length],store:storeIdOf(t)}));
  if(selTrainer && !TRAINERS.some(t=>t.id===selTrainer)) selTrainer=null;
}
function trainerOf(id){ if(!id && SINGLE_TRAINER) id=soleTrainerId(); return TRAINERS.find(t=>t.id===id)||null; }
/* いま見ている店舗のトレーナー。枠の数はこの人数で決まる */
function activeTrainers(){ return USE_STORES ? TRAINERS.filter(t=>t.store===curStore) : TRAINERS; }
function trainerName(id){ const t=trainerOf(id); return t?t.name:'未定'; }
function trainerColorOf(id){ const t=trainerOf(id); return t?t.color:'#9E9E9E'; }
function trainerDot(id){ return `<i class="tdot" style="background:${trainerColorOf(id)}"></i>`; }
/* ---------- お休みの設定（ブロック） ----------
   トレーナーが「この時間は予約を受け付けない」と決めた枠。
   trainer_id が null ならその時間を全員ぶんとめる。会員の画面では「予約不可」と出る */
async function loadBlocks(date){
  const { data } = await sb.from('blocks').select('*').eq('date',date);
  return data||[];
}
function blocksAt(blocks,h){ return (blocks||[]).filter(b=>Number(b.hour)===Number(h)); }
/* その時間が全員ぶんとまっているか */
function blockedAll(blocks,h){ return blocksAt(blocks,h).some(b=>!b.trainer_id); }
/* その時間にとまっている担当の一覧 */
function blockedIds(blocks,h){ return new Set(blocksAt(blocks,h).map(b=>b.trainer_id).filter(Boolean)); }
/* その日の営業時間がすべてお店の休みか */
function storeClosedAllDay(blocks){ return slotHours().every(h=>blockedAll(blocks,h)); }
/* その担当が、自分の休みとして1日すべて休みにしているか */
function trainerOffAllDayOnly(blocks,tid){ return slotHours().every(h=>blockedIds(blocks,h).has(tid)); }
/* 1日まとめての休みに付けたメモ（最初に見つかったもの） */
function dayMemo(blocks,tid){ const b=(blocks||[]).find(x=>(x.trainer_id||null)===(tid||null)&&x.memo); return b?b.memo:''; }
/* 会員がその枠を予約できないか（お店の休み、または選んだ担当が休み） */
function blockedFor(blocks,h,trainerId){
  return blockedAll(blocks,h) || (!!trainerId && blockedIds(blocks,h).has(trainerId));
}

/* その時間の予約 rs に対して、担当 trainerId の枠が空いているか。
   指名なし（null）は「誰か 1 人でも空いていれば可」。未定の予約は空いているトレーナーの数に収まる必要がある。
   blocked（とまっている担当の Set）は埋まっている扱いにする */
function slotFree(rs,trainerId,excludeId,blocked){
  rs=(rs||[]).filter(r=>!excludeId||r.id!==excludeId);
  blocked=blocked||new Set();
  const list=activeTrainers();
  if(!list.length) return rs.length===0;
  const free=list.filter(t=>!blocked.has(t.id) && !rs.some(r=>r.trainer_id===t.id));
  const unassigned=rs.filter(r=>!r.trainer_id).length;
  if(trainerId){
    if(!free.some(t=>t.id===trainerId)) return false;
    return unassigned<=free.length-1;
  }
  return unassigned<free.length;
}
/* off にトレーナーの id を入れると、その担当は選べなくなる（その日ずっと予約をとめている場合） */
function trainerChips(sel,off){
  off=off||new Set();
  const chip=(id,label,color)=>{
    const dead=!!id&&off.has(id);
    return `<span class="chip ${(sel||null)===(id||null)?'sel':''} ${dead?'off':''}"
      ${dead?'':`onclick="pickTrainer(${id?`'${id}'`:'null'})"`}>${color?`<i class="tdot" style="background:${color}"></i>`:''}${esc(label)}${dead?'（受付なし）':''}</span>`;
  };
  return chip(null,'指名なし','')+activeTrainers().map(t=>chip(t.id,t.name,t.color)).join('');
}
/* その日ずっと予約をとめている担当を探す */
function trainersOffAllDay(blocks,ds){
  const hours=slotHours();
  const off=new Set();
  activeTrainers().forEach(t=>{
    const allOff=hours.every(h=>blockedAll(blocks,h)||blockedIds(blocks,h).has(t.id));
    if(allOff) off.add(t.id);
  });
  return off;
}
function pickTrainer(id){ selTrainer=id; render(); }
/* off に入れた担当は選択肢に出さない（その時間の予約をとめている担当） */
function trainerOptions(sel,off){
  off=off||new Set();
  return `<option value="">指名なし（どなたでも）</option>`+
    activeTrainers().filter(t=>!off.has(t.id))
      .map(t=>`<option value="${t.id}" ${t.id===sel?'selected':''}>${esc(t.name)}</option>`).join('');
}

/* 予約シート（新規）
   target を渡すとトレーナーの代理予約になる（{id, name, tickets} の会員）。
   省略時はログイン中の会員本人の予約 */
let rvParty=1;
let rvTarget=null;
async function openReserve(date,hour,target){
  if(isPastSlot(date,hour)){ toast('この時間の受付は終了しました'); render(); return; }
  const who = target || {id:me.id, name:profile.name, tickets:tkOf(profile,curCourse)};
  const proxy = who.id!==me.id;
  rvTarget=who;
  /* トレーナーがとめた枠は会員には開かない（トレーナーの代理予約は開ける） */
  const rvBlocks=inStore(await loadBlocks(date));
  if(!proxy && blockedFor(rvBlocks,hour,selTrainer)){
    toast('この時間は予約を受け付けていません'); render(); return;
  }
  if(!proxy && who.tickets<1 && !trialAvailable()){ showTicketShortage(); return; }
  let gopt='<option value="">（グループなし）</option>';
  if(USE_GROUPS){
    const myGroups=await sb.from('group_members')
      .select('group_id, groups(name)').eq('user_id',who.id);
    (myGroups.data||[]).forEach(g=>gopt+=`<option value="${g.group_id}">${esc(g.groups.name)}</option>`);
  }
  let btns='', maxOK=0;
  for(let n=1;n<=SETTINGS.maxParty;n++){
    /* 代理予約は不足分をその場で追加できるので、人数は制限しない */
    const ok=proxy || ticketCost(n)<=who.tickets;
    if(ok) maxOK=n;
    btns+=`<button type="button" data-n="${n}" ${ok?'':'disabled'} onclick="pickParty(${n})">${n}名</button>`;
  }
  document.getElementById('ovBody').innerHTML=`
    <h3>${proxy?`${esc(who.name)}さんの予約を入れる`:'予約する'}</h3>
    <div class="sub">${USE_COURSES?esc(courseName(curCourse))+'　':''}${jdate(date)}　${hhmm(hour)}〜　${(!proxy&&trialAvailable())?'初回体験（チケット不要）':`チケット<span id="rvCost">1</span>枚消費${proxy?`（残 ${who.tickets}枚）`:''}`}</div>
    ${(USE_PARTY&&!isClassCourse(curCourse))?`<label class="fld">人数</label>
    <div class="party" id="rvParty">${btns}</div>
    ${!proxy&&maxOK<SETTINGS.maxParty?`<div class="small" style="margin-top:6px">チケット残数の都合で、${maxOK}名まで予約できます</div>`:''}`:''}
    ${proxy?`<div id="rvShort" class="small" style="margin-top:6px"></div>`:''}
    <div id="rvGuests"></div>
    ${USE_BODY_PARTS?`<label class="fld">次に鍛えたい部位（任意）</label>
    <div class="chips" id="bodyChips"></div>`:''}
    <label class="fld">ご要望（任意）</label>
    <textarea id="rvNote" placeholder="例：反り腰が気になる／巻き肩が気になる／お尻を上げたい"></textarea>
    ${(SINGLE_TRAINER||(!proxy&&(!MEMBER_PICKS_TRAINER||trialAvailable())))?'':`<label class="fld">担当トレーナー</label>
    <select id="rvTrainer">${trainerOptions(proxy?me.id:selTrainer, proxy?new Set():blockedIds(rvBlocks,hour))}</select>`}
    ${(USE_GROUPS&&!isClassCourse(curCourse))?`<label class="fld">グループ（仲間が相乗り参加できるようになります）</label>
    <select id="rvGroup">${gopt}</select>`:''}
    <div style="height:18px"></div>
    <button class="btn" onclick="submitReserve('${date}',${hour})">${proxy?'この内容で登録する':'この内容で予約する'}</button>`;
  renderBodyChips();
  pickParty(1);
  openOv();
}
/* 人数を選ぶ。2名以上ならお連れ様の名前欄を出す（任意） */
function pickParty(n){
  if(!USE_PARTY) n=1;
  const keep=[...document.querySelectorAll('#rvGuests input')].map(i=>i.value);
  rvParty=n;
  document.querySelectorAll('#rvParty button').forEach(b=>b.classList.toggle('on',+b.dataset.n===n));
  const costEl=document.getElementById('rvCost');
  if(costEl) costEl.textContent=ticketCost(n);
  const diffEl=document.getElementById('rvDiff');
  if(diffEl && rvChange) diffEl.textContent=changeNote(n);
  /* 代理予約：足りない枚数の案内 */
  const shortEl=document.getElementById('rvShort');
  if(shortEl&&rvTarget){
    const short=ticketCost(n)-rvTarget.tickets;
    shortEl.innerHTML= short>0
      ? `チケットが <b>${short}枚</b> 足りません。現金を受け取ったことを確認のうえ、${short}枚を追加してから予約を登録します。`
      : '';
  }
  let g='';
  for(let i=1;i<n;i++){
    g+=`<input placeholder="お連れ様${n>2?i:''}のお名前（任意）" value="${esc(keep[i-1]||'')}" style="margin-top:8px">`;
  }
  document.getElementById('rvGuests').innerHTML=g;
}
let pickedParts=[];
function renderBodyChips(){
  const parts=['胸','背中','肩','腕','脚','腹','尻','全身'];
  pickedParts=[];
  const box=document.getElementById('bodyChips');
  if(!box) return;
  box.innerHTML=parts.map(p=>
    `<span class="chip" data-p="${p}" onclick="togglePart(this)">${p}</span>`).join('');
}
function togglePart(el){
  const p=el.dataset.p;
  if(pickedParts.includes(p)){pickedParts=pickedParts.filter(x=>x!==p);el.classList.remove('sel');}
  else{pickedParts.push(p);el.classList.add('sel');}
}
/* 初回体験。チケットが0枚で、まだ体験を使っていない会員は1回だけ無料で予約できる */
function trialAvailable(){
  if(SHOP.freeTrial===false) return false;
  /* コースを使う店舗では、体験は1つ目のコースだけ */
  if(USE_COURSES && curCourse!==DEFAULT_COURSE) return false;
  return !!profile && profile.role!=='admin' && !profile.trial_used && profile.tickets<1;
}
/* ヒアリングシートを最後まで書き終えているか */
async function intakeDone(uid){
  const { data } = await sb.from('intake_sheets').select('*').eq('user_id',uid).maybeSingle();
  return !!(data && data.completed_at);
}
async function submitReserve(date,hour){
  /* 予約画面を開いたまま時間が過ぎたとき */
  if(isPastSlot(date,hour)){ toast('この時間の受付は終了しました'); closeOv(); render(); return; }
  const note=document.getElementById('rvNote').value.trim();
  const target=[pickedParts.join('・'),note].filter(Boolean).join(' / ');
  const groupId=(document.getElementById('rvGroup')||{}).value||null;
  const party=USE_PARTY?rvParty:1;
  const guests=USE_PARTY?[...document.querySelectorAll('#rvGuests input')].map(i=>i.value.trim()).filter(Boolean):[];
  const who=rvTarget||{id:me.id,name:profile.name,tickets:tkOf(profile,curCourse)};
  const proxy=who.id!==me.id;
  const trial=!proxy && trialAvailable();
  const cost=trial?0:ticketCost(party);
  const short=cost-who.tickets;
  if(short>0&&!proxy){toast('チケットが足りません');return;}
  const trainerId=(document.getElementById('rvTrainer')||{}).value||null;
  const p={date,hour,target,groupId,party,guests,trainerId,cost,trial,who,proxy,short,course:curCourse};
  /* ご本人の予約は、ヒアリングシートを書き終えてから確定する（ゲストは書かない） */
  /* すでに通われている方・台帳の方は、店頭で伺っているのでヒアリングは出さない */
  if(!proxy && !profile.guest && !profile.no_intake && !(await intakeDone(who.id))){
    closeOv();
    const { data:sheet } = await sb.from('intake_sheets').select('*').eq('user_id',who.id).maybeSingle();
    startWizard(rowToIntake(sheet), async d=>{
      await sb.from('intake_sheets').upsert({ ...intakeToRow(d,who.id), completed_at:new Date().toISOString() });
      const ok=await finalizeReserve(p);
      if(!ok) wizClose();
    }, { required:true, onCancel:()=>toast('予約をやめました') });
    wiz.doneTitle='ご予約ありがとうございます';
    wiz.doneText=`${jdate(date)}　${hhmm(hour)}〜 でお待ちしています。<br>当日は動きやすい服装でお越しください。`;
    return;
  }
  await finalizeReserve(p);
}
/* 予約を書き込む。空き・とめた枠をもう一度確かめてから登録する */
async function finalizeReserve(p){
  if(isPastSlot(p.date,p.hour)){ toast('この時間の受付は終了しました'); closeOv(); render(); return false; }
  const blocks=inStore(await loadBlocks(p.date));
  if(!p.proxy && blockedFor(blocks,p.hour,p.trainerId)){
    toast('この時間は予約を受け付けていません'); closeOv(); render(); return false;
  }
  const { data:ex } = await sb.from('reservations').select('*').eq('date',p.date).eq('hour',p.hour);
  /* クラス形式は、同じ方が同じ時間に2回入らないようにする */
  if(USE_COURSES && isClassCourse(p.course) && inStore(ex).some(r=>r.user_id===p.who.id)){
    toast(p.proxy?`${p.who.name}さんは、この時間にすでに予約があります`:'この時間はすでに予約済みです'); closeOv(); render(); return false;
  }
  if(!slotOpen(inStore(ex),p.trainerId,null,p.proxy?new Set():blockedIds(blocks,p.hour),p.course)){
    toast((USE_COURSES&&isClassCourse(p.course))?'この枠は満員になりました':(p.trainerId?'その担当は、この時間はもう埋まっています':'この枠は埋まりました')); closeOv(); render(); return false;
  }
  /* 代理予約で足りない分は、現金受領を前提にここで追加する（履歴は別に残る） */
  if(p.short>0) await addTickets(p.who.id,p.short,'店頭購入（トレーナー登録）',p.course);
  const { error } = await sb.from('reservations').insert({
    user_id:p.who.id,date:p.date,hour:p.hour,target:p.target,group_id:p.groupId,status:'booked',
    party:p.party,guests:p.guests,tickets_used:p.cost,trainer_id:p.trainerId||soleTrainerId(),trial:!!p.trial,
    store:curStore, ...courseTag(p.course)
  });
  if(error){toast('エラー: '+error.message);return false;}
  if(p.trial){
    await sb.from('profiles').update({trial_used:true}).eq('id',p.who.id);
    await sb.from('ticket_history').insert({user_id:p.who.id,delta:0,memo:`初回体験 ${jdate(p.date)} ${hhmm(p.hour)}`,by_admin:false});
    if(!p.proxy) profile.trial_used=true;
  }else if(p.cost>0){
    await consumeTicket(p.who.id,p.cost,`予約 ${jdate(p.date)} ${hhmm(p.hour)}${p.party>1?`（${p.party}名）`:''}${p.proxy?'（トレーナー登録）':''}`,p.course);
    if(!p.proxy) profile[tkField(p.course)]=tkOf(profile,p.course)-p.cost;
  }
  /* 初めての予約が入ったら、マイ予約やマイページも使えるようにする（ゲストは出さない） */
  const guestSelf = !p.proxy && profile.guest;
  if(!guestSelf && !p.who.booked_once){
    await sb.from('profiles').update({booked_once:true}).eq('id',p.who.id);
    if(!p.proxy){ profile.booked_once=true; buildTabs(); }
  }
  sendMail('booked',{userId:p.who.id,date:p.date,hour:p.hour,trainerId:p.trainerId,trial:p.trial,store:curStore});
  toast(p.proxy?`${p.who.name}さんの予約を登録しました`:(p.trial?'初回体験のご予約を承りました':'予約しました'));
  closeOv();
  render();
  return true;
}

/* ---------- 予約の日時変更 ----------
   会員は自分の予約を締め切り（pastDeadline）まで、トレーナーは任意の予約を（当日でも）別の空き枠へ移せる。
   チケットの枚数は変えない。相乗り参加者は予約に紐づいているのでそのまま付いてくる */
let mv={id:null,r:null,date:null};
async function openMove(id){

  const days=nextDays(BOOK_AHEAD_DAYS).map(fmtDate);
  mv={id,r,date:days.includes(r.date)?r.date:days[0]};
  const opts=days.map(ds=>`<option value="${ds}" ${ds===mv.date?'selected':''}>${jdate(ds)}</option>`).join('');
  document.getElementById('ovBody').innerHTML=`
    <h3>予約の日時を変更</h3>

    ${(!SINGLE_TRAINER&&(isAdmin||MEMBER_PICKS_TRAINER))?`<label class="fld">担当トレーナー</label>
    <select id="mvTrainer" onchange="mvRenderSlots()">${trainerOptions(r.trainer_id||null)}</select>`:''}

  openOv();
  mvRenderSlots();

function mvPickDate(ds){ mv.date=ds; mvRenderSlots(); }
/* 変更後の担当。担当の欄が無い（会員）ときは未定に戻し、お店で決め直す */
function mvTid(){ const el=document.getElementById('mvTrainer'); return el?(el.value||null):soleTrainerId(); }
async function mvRenderSlots(){
  const el=document.getElementById('mvSlots'); if(!el)return;
  const { data:resv } = await sb.from('reservations').select('*').eq('date',mv.date);
  const tid=mvTid();
  const byHour={};inStore(resv).forEach(r=>(byHour[r.hour]=byHour[r.hour]||[]).push(r));
  const isAdmin=profile.role==='admin';
  const blocks=inStore(await loadBlocks(mv.date));
  el.innerHTML=slotHours().map(h=>{
    const cur=(mv.date===mv.r.date && h===mv.r.hour);
    const blocked=blockedFor(blocks,h,tid);
    if(blocked && !isAdmin && !cur) return `<div class="slot taken"><div class="t">${hhmm(h)}</div><div class="s">${blockedAll(blocks,h)?'お休み':'予約不可'}</div></div>`;
    const free=slotOpen(byHour[h]||[],tid,mv.id,isAdmin?new Set():blockedIds(blocks,h),courseIdOf(mv.r));
    /* 同じ枠でも担当だけ変えることはできる */
    if(cur && tid===(mv.r.trainer_id||null)) return `<div class="slot mine"><div class="t">${hhmm(h)}</div><div class="s">現在の予約</div></div>`;
    if(cur && free) return `<div class="slot open" onclick="submitMove(${h})"><div class="t">${hhmm(h)}</div><div class="s">担当のみ変更</div></div>`;
    if(!free) return `<div class="slot taken"><div class="t">${hhmm(h)}</div><div class="s">予約あり</div></div>`;
    if(isPastSlot(mv.date,h)) return `<div class="slot taken"><div class="t">${hhmm(h)}</div><div class="s">受付終了</div></div>`;
    return `<div class="slot open" onclick="submitMove(${h})"><div class="t">${hhmm(h)}</div><div class="s">空き</div></div>`;
  }).join('');
}
async function submitMove(h){
  if(isPastSlot(mv.date,h)){toast('この時間の受付は終了しました');mvRenderSlots();return;}
  const tid=mvTid();
  if(profile.role!=='admin' && blockedFor(inStore(await loadBlocks(mv.date)),h,tid)){
    toast('この時間は予約を受け付けていません');mvRenderSlots();return;
  }
  const { data:ex } = await sb.from('reservations').select('*').eq('date',mv.date).eq('hour',h);
  if(!slotOpen(inStore(ex),tid,mv.id,null,courseIdOf(mv.r))){toast('この枠は埋まりました');mvRenderSlots();return;}
  const { error } = await sb.from('reservations').update({date:mv.date,hour:h,trainer_id:tid}).eq('id',mv.id);
  if(error){toast('エラー: '+(error.message||'変更できませんでした'));return;}
  sendMail('moved',{userId:mv.r.user_id,date:mv.date,hour:h,trainerId:tid,trial:mv.r.trial,fromDate:mv.r.date,fromHour:mv.r.hour,store:storeIdOf(mv.r)});
  toast(tid?`${jdate(mv.date)} ${hhmm(h)}（担当：${trainerName(tid)}）に変更しました`:`${jdate(mv.date)} ${hhmm(h)} に変更しました`);
  closeOv();
  render();
}

        ${r.trainer_id?`<div class="meta">${trainerDot(r.trainer_id)}担当：${esc(trainerName(r.trainer_id))}</div>`:''}

        ${USE_PARTY?`<button class="btn sm ghost row" onclick="openChangeParty('${r.id}')">人数変更</button>`:''}
        ${pastDeadline(r)?'':`<button class="btn sm ghost row" onclick="openMove('${r.id}')">日時変更</button>`}

/* ---------- マイ予約：人数の変更 ---------- */
/* 変更中の予約。{id, used:使用済みチケット, sameDay:当日か} */
let rvChange=null;
/* 人数を変えたときのチケットの増減。締め切り後に減らした分は戻さない（取消と同じ決まり） */
function changeCharge(n){
  const cost=ticketCost(n), c=rvChange;
  if(c.sameDay) return { add:Math.max(0,cost-c.used), back:0, used:Math.max(cost,c.used) };
  return { add:Math.max(0,cost-c.used), back:Math.max(0,c.used-cost), used:cost };
}
function changeNote(n){
  const x=changeCharge(n);
  if(x.add) return `チケットがあと${x.add}枚引かれます`;
  if(x.back) return `チケットが${x.back}枚戻ります`;
  if(rvChange.sameDay && ticketCost(n)<rvChange.used) return `${LATE_REASON}、チケットは戻りません`;
  return 'チケットの枚数は変わりません';
}
async function openChangeParty(id){
  const { data:r } = await sb.from('reservations').select('*, reservation_participants(user_id)').eq('id',id).single();
  if(!r){ toast('予約が見つかりません'); render(); return; }
  if(isPastSlot(r.date,r.hour)){ toast('始まった予約は変更できません'); render(); return; }
  rvChange={ id, used:usedOf(r), sameDay:pastDeadline(r), course:courseIdOf(r) };
  const others=(r.reservation_participants||[]).length;   // グループで相乗り参加している人
  const cur=partyOf(r);
  let btns='';
  for(let n=1;n<=Math.max(cur,SETTINGS.maxParty-others);n++){
    const ok=n<=SETTINGS.maxParty-others && changeCharge(n).add<=tkOf(profile,rvChange.course);
    btns+=`<button type="button" data-n="${n}" ${ok||n===cur?'':'disabled'} onclick="pickParty(${n})">${n}名</button>`;
  }
  document.getElementById('ovBody').innerHTML=`
    <h3>人数を変更する</h3>
    <div class="sub">${jdate(r.date)}　${hhmm(r.hour)}〜　いまは${cur}名で予約中</div>
    <label class="fld">人数</label>
    <div class="party" id="rvParty">${btns}</div>
    ${others?`<div class="small" style="margin-top:6px">グループの仲間 ${others}名が参加しているため、${SETTINGS.maxParty-others}名まで選べます</div>`:''}
    <div id="rvGuests"></div>
    <div class="small" id="rvDiff" style="margin-top:12px;font-weight:700;color:var(--ink)"></div>
    <div style="height:18px"></div>
    <button class="btn" onclick="submitChangeParty()">この内容で変更する</button>`;
  pickParty(cur);
  document.querySelectorAll('#rvGuests input').forEach((el,i)=>{ el.value=(r.guests||[])[i]||''; });
  openOv();
}
async function submitChangeParty(){
  const c=rvChange;
  const { data:r } = await sb.from('reservations').select('*, reservation_participants(user_id)').eq('id',c.id).single();
  if(!r){ toast('予約が見つかりません'); closeOv(); render(); return; }
  if(isPastSlot(r.date,r.hour)){ toast('始まった予約は変更できません'); closeOv(); render(); return; }
  const n=rvParty, before=partyOf(r);
  if(n+(r.reservation_participants||[]).length>SETTINGS.maxParty){ toast('満員のため、その人数にはできません'); return; }
  const x=changeCharge(n);
  if(x.add>tkOf(profile,c.course)){ toast('チケットが足りません'); return; }
  const guests=[...document.querySelectorAll('#rvGuests input')].map(i=>i.value.trim()).filter(Boolean);
  /* 先に予約を書き換える。書き換えられなかったときにチケットだけ動く、を防ぐ */
  await sb.from('reservations').update({ party:n, guests, tickets_used:x.used }).eq('id',c.id);
  const memo=`人数変更 ${jdate(r.date)} ${hhmm(r.hour)}（${before}名→${n}名）`;
  if(x.add){ await consumeTicket(me.id,x.add,memo,c.course); profile[tkField(c.course)]=tkOf(profile,c.course)-x.add; }
  if(x.back){ await refundTicket(me.id,x.back,memo,c.course); profile[tkField(c.course)]=tkOf(profile,c.course)+x.back; }
  rvChange=null;
  closeOv();
  toast(n===before?'お連れ様のお名前を変更しました'
    : x.add?`${n}名に変更しました（チケット${x.add}枚使用）`
    : x.back?`${n}名に変更しました（チケット${x.back}枚返却）`
    : `${n}名に変更しました`);
  render();
}

async function cancelReserve(id){
  const { data:r } = await sb.from('reservations').select('*').eq('id',id).single();
  if(isPastSlot(r.date,r.hour)){ toast('終わったご予約は取り消せません。トレーナーにご連絡ください'); render(); return; }
  const sameDay=pastDeadline(r);
  const msg=sameDay
    ?(r.trial?`予約を取り消します。\n${LATE_REASON}、初回体験は使ったままになります。よろしいですか？`
            :`予約を取り消します。\n${LATE_REASON}、チケットは返却されません。よろしいですか？`)
    :(r.trial?'予約を取り消します。\n初回体験は、もう一度お使いいただけます。よろしいですか？'
            :'予約を取り消します。\nチケットは返却されます。よろしいですか？');
  if(!(await askConfirm(msg,'取り消す',true)))return;
  const { data:parts } = await sb.from('reservation_participants').select('user_id').eq('reservation_id',id);
  /* 先に予約を消す。消せなかったときにチケットだけ戻る、を防ぐ */
  await sb.from('reservation_participants').delete().eq('reservation_id',id);
  const back=(!sameDay && !r.trial) ? usedOf(r) : 0;
  if(back>0){
    /* 予約を消すのと同時にチケットを戻す（どちらかだけ、が起きないようにする） */
    const { error } = await sb.batch()
      .delete('reservations',id)
      .update('profiles',me.id,{[tkField(courseIdOf(r))]:tkOf(profile,courseIdOf(r))+back,refund_res:id})
      .commit();
    if(error){ toast('取り消しできませんでした'); render(); return; }
    profile[tkField(courseIdOf(r))]=tkOf(profile,courseIdOf(r))+back;
    await sb.from('ticket_history').insert({user_id:me.id,delta:back,memo:`予約取消（${UNTIL}）`,by_admin:false,...courseTag(courseIdOf(r))});
  }else{
    await sb.from('reservations').delete().eq('id',id);
  }
  sendMail('cancelled',{userId:me.id,date:r.date,hour:r.hour,trial:r.trial,refund:!sameDay,store:storeIdOf(r)});
  if(!sameDay){
    for(const p of (parts||[])) await refundTicket(p.user_id,1,'予約取消に伴う返却',courseIdOf(r));
    if(r.trial){
      /* 体験の予約を締め切りまでに取り消した場合は、体験をもう一度使えるようにする */
      await sb.from('profiles').update({trial_used:false}).eq('id',me.id);
      profile.trial_used=false;
    }
    toast(r.trial?'取り消しました。初回体験はもう一度お使いいただけます':'取り消し、チケットを返却しました');
  }else{
    toast('取り消しました（チケットの返却なし）');
  }
  render();
}
async function cancelJoin(resId){
  const { data:r } = await sb.from('reservations').select('*').eq('id',resId).single();
  if(isPastSlot(r.date,r.hour)){ toast('終わったご予約は取り消せません。トレーナーにご連絡ください'); render(); return; }

    ?`予約への参加を取り消します。\n${LATE_REASON}、チケットは返却されません。よろしいですか？`

  if(!(await askConfirm(msg,'取り消す',true)))return;

async function refundTicket(uid,n,memo,cid){

/* トレーナーが店頭でチケットを追加する（by_admin=true で「店頭追加」と表示される） */
async function addTickets(uid,n,memo,cid){

  await sb.from('ticket_history').insert({user_id:uid,delta:n,memo,by_admin:true,...courseTag(cid)});
}

/* ======================================================
   カウンセリングシート（設問は config.js の intake で定義）
   このファイルは設問を持ちません。増減も文言も config.js 側です。
   ====================================================== */
const INTAKE_STEPS = (SHOP.intake && SHOP.intake.steps) || [];
const INTAKE_FIELDS = INTAKE_STEPS.reduce((a,s)=>a.concat(s.fields||[]),[]);

/* トレーナー側のシート閲覧用 [保存キー, 見出し, 追記キー]
   見出しは field.label、無ければその画面のタイトル */
const SHEET_FIELDS = INTAKE_STEPS.reduce((a,st)=>{
  (st.fields||[]).forEach(f=>{
    a.push([f.key, f.label || st.title || f.key, f.detail ? f.key+'_detail' : null]);
  });
  return a;
},[]);

const esc = v => String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function emptyIntake(){
  const d={};
  INTAKE_FIELDS.forEach(f=>{
    if(f.type==='multi'){ d[f.key]=[]; if(f.other) d[f.key+'_other']=''; }
    else { d[f.key]=''; if(f.detail) d[f.key+'_detail']=''; }
  });
  return d;
}
function intakeToRow(d,uid){
  const r={user_id:uid};
  INTAKE_FIELDS.forEach(f=>{
    if(f.type==='multi'){
      const other=d[f.key+'_other'];
      r[f.key]=[...(d[f.key]||[]),...(other?[other]:[])].join('、');
    }else{
      r[f.key]=String(d[f.key]||'');
      if(f.detail) r[f.key+'_detail']=String(d[f.key+'_detail']||'');
    }
  });
  return r;
}
function rowToIntake(r){
  const d=emptyIntake(); if(!r) return d;
  INTAKE_FIELDS.forEach(f=>{
    if(f.type==='multi'){
      (r[f.key]||'').split('、').filter(Boolean).forEach(v=>{
        if((f.options||[]).includes(v)) d[f.key].push(v);
        else if(f.other) d[f.key+'_other'] = d[f.key+'_other'] ? d[f.key+'_other']+'、'+v : v;
      });
    }else{
      d[f.key]=r[f.key]||'';
      if(f.detail) d[f.key+'_detail']=r[f.key+'_detail']||'';
    }
  });
  return d;
}
/* 1問でも答えがあれば「記入済み」とみなす */
function intakeFilled(r){
  return !!r && INTAKE_FIELDS.some(f=>String(r[f.key]||'').trim()!=='');
}
/* マイページに出す要約。config.js の intake.summary でキーを指定できる */
function intakeSummary(r){
  if(!r) return '';
  const keys = (SHOP.intake && SHOP.intake.summary) || INTAKE_FIELDS.slice(0,2).map(f=>f.key);
  const labels = {}; SHEET_FIELDS.forEach(([k,label])=>{ labels[k]=label; });
  return keys.map(k=>{
    const v=String(r[k]||'').trim();
    return esc(labels[k]||k)+'：'+(v?esc(v):'未記入');
  }).join('<br>');
}

/* ---------- ウィザード ---------- */
let wiz={step:0,data:null,onDone:null};
/* opts.required=true で「あとで入力」を出さない（予約前の必須入力で使う）
   opts.onCancel は、必須のときに途中でやめた場合に呼ぶ */
function startWizard(prefill,onDone,opts){
  opts=opts||{};
  wiz={step:0,data:prefill||emptyIntake(),onDone,required:!!opts.required,onCancel:opts.onCancel||null,submitLabel:opts.submitLabel||''};
  document.querySelector('.wiz-skip').style.display = wiz.required ? 'none' : '';
  document.getElementById('wiz').classList.add('show');
  lockScroll(true);
  wizRender();
}
/* 必須の入力を途中でやめる */
function wizCancel(){
  const f=wiz.onCancel;
  wizClose();
  if(f) f();
}
function wizChip(key,val,multi){
  const cur=wiz.data[key];
  const sel=multi?(cur||[]).includes(val):cur===val;
  return `<span class="chip ${sel?'sel':''}" data-v="${esc(val)}" onclick="${multi?'wizToggle':'wizPick'}('${key}','${val}',this)">${val}</span>`;
}
/* 1つ選ぶ: 画面は描き直さず、選んだ印と追記欄だけ入れ替える */
function wizPick(key,val){
  wizCollect();
  const now = wiz.data[key]===val ? '' : val;
  wiz.data[key]=now;
  const box=document.getElementById('wzc_'+key);
  if(box) box.querySelectorAll('.chip').forEach(c=>c.classList.toggle('sel', c.dataset.v===now));
  const dbox=document.getElementById('wzd_'+key);
  if(!dbox) return;
  const f=INTAKE_FIELDS.find(x=>x.key===key);
  const dl=f && f.detail && f.detail[now];
  if(dbox.dataset.for===now) return;          /* 同じ追記欄のままなら触らない */
  dbox.dataset.for=now;
  dbox.innerHTML = dl
    ? `<label class="fld">${dl}</label><input id="wz_${key}_detail" value="${esc(wiz.data[key+'_detail']||'')}">`
    : '';
}
/* いくつでも選ぶ: 見た目だけ切り替える（入力中の文字を消さないため） */
function wizToggle(key,val,el){
  const a=wiz.data[key], i=a.indexOf(val);
  if(i>=0){ a.splice(i,1); el.classList.remove('sel'); }
  else { a.push(val); el.classList.add('sel'); }
}
function wizCollect(){
  const g=id=>{const e=document.getElementById(id);return e?e.value.trim():null;};
  INTAKE_FIELDS.forEach(f=>{
    const ids=[];
    if(f.type==='multi'){ if(f.other) ids.push(f.key+'_other'); }
    else if(f.type==='single'){ if(f.detail) ids.push(f.key+'_detail'); }
    else ids.push(f.key);
    ids.forEach(k=>{ const v=g('wz_'+k); if(v!==null) wiz.data[k]=v; });
  });
}
function wizField(f,d){
  const lab = f.label ? `<label class="fld">${f.label}</label>` : '';
  if(f.type==='single'){
    const chips=`<div class="bigchips" id="wzc_${f.key}">${(f.options||[]).map(v=>wizChip(f.key,v,false)).join('')}</div>`;
    const dl=f.detail && f.detail[d[f.key]];
    /* 追記欄はこの箱の中だけ入れ替える。画面全体は描き直さない */
    return lab+chips+`<div id="wzd_${f.key}" data-for="${esc(d[f.key]||'')}">${dl
      ? `<label class="fld">${dl}</label><input id="wz_${f.key}_detail" value="${esc(d[f.key+'_detail'])}">`
      : ''}</div>`;
  }
  if(f.type==='multi'){
    const chips=`<div class="bigchips">${(f.options||[]).map(v=>wizChip(f.key,v,true)).join('')}</div>`;
    const ot=f.other
      ? `<label class="fld">${f.other}（任意）</label><input id="wz_${f.key}_other" value="${esc(d[f.key+'_other'])}" placeholder="自由にお書きください">`
      : '';
    return lab+chips+ot;
  }
  if(f.type==='textarea')
    return lab+`<textarea id="wz_${f.key}" placeholder="${esc(f.placeholder||'')}">${esc(d[f.key])}</textarea>`;
  const type = f.type==='number'?'number' : f.type==='tel'?'tel' : f.type==='date'?'date' : 'text';
  const mode = f.type==='number'?' inputmode="numeric"' : '';
  return lab+`<input id="wz_${f.key}" type="${type}"${mode} value="${esc(d[f.key])}" placeholder="${esc(f.placeholder||'')}">`;
}
function wizRender(){
  const d=wiz.data, total=INTAKE_STEPS.length, last=total-1;
  const body=document.getElementById('wizBody');
  const foot=document.getElementById('wizFoot');
  document.getElementById('wizStep').textContent=(Math.min(wiz.step,last)+1)+'/'+total;
  document.getElementById('wizProg').style.width=((Math.min(wiz.step,last)+1)/total*100)+'%';
  document.querySelector('.wiz-top').style.display = wiz.step>last ? 'none' : 'flex';

  if(wiz.step>last){
    body.innerHTML='';
    body.insertAdjacentHTML('beforeend',`<div class="wiz-done">
      <div style="width:90px;height:90px;color:var(--ink)">${logoSVG(false)}</div>
      <h3>${wiz.doneTitle||`ようこそ、${SHOP.name}へ！`}</h3>
      <p>${wiz.doneText||'ご回答ありがとうございました。<br>当日お会いできるのを楽しみにしています。'}</p>
      <button class="btn" style="max-width:280px" onclick="wizClose()">${wiz.doneButton||'はじめる'}</button>
    </div>`);
    foot.innerHTML='';
    return;
  }
  const st=INTAKE_STEPS[wiz.step];
  body.innerHTML = `<h3>${st.title||''}</h3>`
    + (st.lead?`<div class="lead">${st.lead}</div>`:'')
    + (st.fields||[]).map(f=>wizField(f,d)).join('');
  body.style.animation='none';body.offsetHeight;body.style.animation='';
  const back = wiz.step>0 ? 'wizBack()' : (wiz.required ? 'wizCancel()' : 'wizSkip()');
  foot.innerHTML=`
    <button class="btn ghost" style="flex:1" onclick="${back}">${wiz.step>0||!wiz.required?'戻る':(wiz.submitLabel?'あとで':'やめる')}</button>
    <button class="btn" style="flex:2" onclick="wizNext()">${wiz.step===last?(wiz.submitLabel||(wiz.required?'この内容で予約する':'回答を送信する')):'次へ'}</button>`;
}
async function wizNext(){
  wizCollect();
  const last=INTAKE_STEPS.length-1;
  if(wiz.step<last){ wiz.step++; wizRender(); wizAutosave(); }
  else{
    if(wiz.onDone) await wiz.onDone(wiz.data);
    wiz.step=last+1; wizRender();
  }
}
function wizBack(){wizCollect();wiz.step--;wizRender();wizAutosave();}
/* 1画面ごとに途中まで保存する。最後まで行かずに閉じても、書いた分は残る */
function wizAutosave(){
  if(!wiz.data || !me) return;
  sb.from('intake_sheets').upsert(intakeToRow(wiz.data, me.id)).then(()=>{},e=>console.error(e));
}
/* 入力の途中でアプリを切り替えたり閉じたりしたときも保存する */
document.addEventListener('visibilitychange',()=>{

/* ---------- 回数券の有効期限 ----------
   config.js の ticketMonths（月数）で決まる。0 や未指定なら何も出さない。
   数え始めは「最後にトレーナーが追加した日」＝店頭で買った日。
   config.js の ticketFrom が "firstUse" の店舗は、その購入のあと初めて使った日から数える
   （まだ使っていなければ期限は始まらない） */
const TICKET_MONTHS=Number(SHOP.ticketMonths)||0;
const TICKET_FROM_USE=SHOP.ticketFrom==='firstUse';
function ymdSlash(d){ return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`; }
function ticketTerm(hist){
  if(!TICKET_MONTHS) return null;
  const buys=(hist||[]).filter(h=>Number(h.delta)>0 && h.by_admin && h.created_at);
  if(!buys.length) return null;
  let from=buys.map(h=>new Date(h.created_at)).sort((a,b)=>b-a)[0];
  if(TICKET_FROM_USE){
    const uses=(hist||[]).filter(h=>Number(h.delta)<0 && h.created_at)
      .map(h=>new Date(h.created_at)).filter(d=>d>=from).sort((a,b)=>a-b);
    if(!uses.length) return { from, to:null, days:null, unused:true };
    from=uses[0];
  }
  const to=new Date(from);
  to.setMonth(to.getMonth()+TICKET_MONTHS);
  to.setHours(23,59,59,999);
  return { from, to, days: Math.ceil((to.getTime()-Date.now())/86400000) };
}
/* 期限の1行。残0枚のときは出さない。切れている・近いときは赤で出す */
function ticketTermLine(hist,tickets){
  const t=ticketTerm(hist);
  if(!t || Number(tickets)<=0) return '';
  if(t.unused) return `<div class="small" style="color:var(--muted)">期限は、初めてのご利用から${TICKET_MONTHS}ヶ月です</div>`;
  const over=t.days<0;
  const soon=!over && t.days<=14;
  const col=(over||soon)?'var(--danger)':'var(--muted)';
  const txt=over?`期限切れ（${ymdSlash(t.to)}）`:`期限 ${ymdSlash(t.to)}　あと${t.days}日`;
  return `<div class="small" style="color:${col};font-weight:${(over||soon)?700:400}">${TICKET_FROM_USE?'初回のご利用':'最後のご購入'} ${ymdSlash(t.from)}　·　${txt}</div>`;
}

/* トレーナーが、会員のヒアリングシートを書き込む・直す。
   店頭で伺った内容を入れるため。1問ずつではなく、カルテの中で全部まとめて直せる */
let msEdit=null;
async function editMemberSheet(uid){
  const { data:sheet } = await sb.from('intake_sheets').select('*').eq('user_id',uid).maybeSingle();
  const box=document.getElementById('mSheetBody');
  if(!box) return;

    + `<div style="display:flex;gap:8px;margin-top:18px">
         <button class="btn sm ghost" style="flex:1" onclick="cancelMemberSheet()">やめる</button>
         <button class="btn sm" style="flex:2" onclick="saveMemberSheet()">保存する</button>
       </div>`;
}
/* 見出しは、設問に label があればそれ、無ければその画面のタイトル（カルテの表示と揃える） */
function msField(f,d,ttl){
  const lab=`<label class="fld">${esc(f.label||ttl||f.key)}</label>`;
  if(f.type==='single'){
    const chips=`<div class="chips" id="msc_${f.key}">${(f.options||[]).map(v=>msChip(f.key,v,d[f.key]===v,false)).join('')}</div>`;
    const dl=f.detail && f.detail[d[f.key]];
    /* 追記欄はこの箱の中だけ入れ替える */
    return lab+chips+`<div id="msd_${f.key}" data-for="${esc(d[f.key]||'')}">${dl
      ? `<label class="fld">${esc(dl)}</label><input id="ms_${f.key}_detail" value="${esc(d[f.key+'_detail'])}">`
      : ''}</div>`;
  }
  if(f.type==='multi'){
    const chips=`<div class="chips">${(f.options||[]).map(v=>msChip(f.key,v,(d[f.key]||[]).includes(v),true)).join('')}</div>`;
    const ot=f.other
      ? `<label class="fld">${esc(f.other)}</label><input id="ms_${f.key}_other" value="${esc(d[f.key+'_other'])}">`
      : '';
    return lab+chips+ot;
  }
  if(f.type==='textarea')
    return lab+`<textarea id="ms_${f.key}" placeholder="${esc(f.placeholder||'')}">${esc(d[f.key])}</textarea>`;
  const type = f.type==='number'?'number' : f.type==='tel'?'tel' : f.type==='date'?'date' : 'text';
  const mode = f.type==='number'?' inputmode="numeric"' : '';
  return lab+`<input id="ms_${f.key}" type="${type}"${mode} value="${esc(d[f.key])}" placeholder="${esc(f.placeholder||'')}">`;
}
function msChip(key,val,sel,multi){
  return `<span class="chip ${sel?'sel':''}" data-v="${esc(val)}" onclick="${multi?'msToggle':'msPick'}('${key}','${val}',this)">${esc(val)}</span>`;
}
/* 1つ選ぶ。もう一度押すと選び直せる */
function msPick(key,val){
  if(!msEdit) return;
  msCollect();
  const d=msEdit.data;
  const now = d[key]===val ? '' : val;
  d[key]=now;
  const box=document.getElementById('msc_'+key);
  if(box) box.querySelectorAll('.chip').forEach(c=>c.classList.toggle('sel', c.dataset.v===now));
  const dbox=document.getElementById('msd_'+key);
  if(!dbox) return;
  const f=INTAKE_FIELDS.find(x=>x.key===key);
  const dl=f && f.detail && f.detail[now];
  if(dbox.dataset.for===now) return;
  dbox.dataset.for=now;
  dbox.innerHTML = dl
    ? `<label class="fld">${esc(dl)}</label><input id="ms_${key}_detail" value="${esc(d[key+'_detail']||'')}">`
    : '';
}
/* いくつでも選ぶ。見た目だけ切り替える（書きかけの文字を消さないため） */
function msToggle(key,val,el){
  if(!msEdit) return;
  const a=msEdit.data[key], i=a.indexOf(val);
  if(i>=0){ a.splice(i,1); el.classList.remove('sel'); }
  else { a.push(val); el.classList.add('sel'); }
}
/* 画面に入力された文字を、手元の控えに取り込む */
function msCollect(){
  if(!msEdit) return;
  const g=id=>{const e=document.getElementById(id);return e?e.value.trim():null;};
  INTAKE_FIELDS.forEach(f=>{
    const ids=[];
    if(f.type==='multi'){ if(f.other) ids.push(f.key+'_other'); }
    else if(f.type==='single'){ if(f.detail) ids.push(f.key+'_detail'); }
    else ids.push(f.key);
    ids.forEach(k=>{ const v=g('ms_'+k); if(v!==null) msEdit.data[k]=v; });
  });
}
async function saveMemberSheet(){
  if(!msEdit) return;
  msCollect();
  const uid=msEdit.uid, d=msEdit.data;
  msEdit=null;
  await sb.from('intake_sheets').upsert(intakeToRow(d,uid));
  toast('ヒアリングシートを保存しました');
  await openMemberDetail(uid);
}
function cancelMemberSheet(){
  const uid=msEdit&&msEdit.uid;
  msEdit=null;
  if(uid) openMemberDetail(uid);
}

async function changePassword(){
  const p1=document.getElementById('newPass').value;
  const p2=document.getElementById('newPass2').value;
  if(!p1){toast('新しいパスワードを入力してください');return;}
  if(p1.length<6){toast('パスワードは6文字以上にしてください');return;}
  if(p1!==p2){toast('パスワードが一致していません');return;}
  const { error } = await sb.auth.updateUser({password:p1});
  if(error){toast('エラー: '+error.message);return;}
  document.getElementById('newPass').value='';
  document.getElementById('newPass2').value='';
  toast('パスワードを変更しました');
}

/* ======================================================
   管理者：予約状況
   ====================================================== */
/* ---------- トレーナー：予約カレンダー（TimeTree 風） ----------
   月のマス目に担当色のラベル（時刻＋会員名）を並べ、日をタップするとその日の予約一覧、
   予約をタップすると詳細と操作（担当・日時変更・取消）。右下の ＋ で代理予約 */
let calYM=null;    /* 表示中の月 "YYYY-MM" */
let calFilter='all';   /* 'all' | トレーナー id | 'none'（担当未定＝ゲストのみ） */
function calMatch(r){
  if(calFilter==='all') return true;
  if(calFilter==='none') return !r.trainer_id;
  return r.trainer_id===calFilter;
}
function calFilterChips(){
  const chip=(key,label,color)=>`<span class="chip ${calFilter===key?'sel':''}" onclick="calFilter='${key}';render()">${color?`<i class="tdot" style="background:${color}"></i>`:''}${esc(label)}</span>`;
  return chip('all','全員','')+activeTrainers().map(t=>chip(t.id,t.name.replace(/トレーナー$/,''),t.color)).join('')+chip('none','担当未定','#9E9E9E');
}
function ymOf(ds){ return ds.slice(0,7); }
function monthRange(ym){
  const [y,m]=ym.split('-').map(Number);
  const first=new Date(y,m-1,1), last=new Date(y,m,0);
  return {first,last,start:fmtDate(first),end:fmtDate(last)};
}
function ttMove(step){
  const [y,m]=calYM.split('-').map(Number);
  const d=new Date(y,m-1+step,1);
  calYM=fmtDate(d).slice(0,7);
  render();
}
function ttToday(){ selDate=fmtDate(new Date()); calYM=ymOf(selDate); render(); }
function calPick(ds){ selDate=ds; calYM=ymOf(ds); render(); }
function evLabel(r){
  const name=(r.profiles&&r.profiles.name)?r.profiles.name:'';
  return `${hhmm(r.hour)} ${name.split(/\s| /)[0]}`;
}
async function adminReserveView(){
  const todayS=fmtDate(new Date());
  if(!selDate) selDate=todayS;
  if(!calYM) calYM=ymOf(selDate);
  const {first,last,start,end}=monthRange(calYM);
  /* 月の予約・月のお休み・選んだ日の予約・選んだ日のお休みを同時に読む */
  const [{ data:month },{ data:monthBlocks },{ data:resv },blocks,{ data:future }] = await Promise.all([
    sb.from('reservations').select('*, profiles(name)').gte('date',start).lte('date',end),
    sb.from('blocks').select('*').gte('date',start).lte('date',end),
    sb.from('reservations').select('*, profiles(name), reservation_participants(target, profiles(name))').eq('date',selDate).order('hour'),
    loadBlocks(selDate).then(inStore),
    sb.from('reservations').select('*, profiles(name)').gte('date',todayS),
  ]);
  /* 担当が決まっていない予約（今日以降。いま見ている店舗の分） */
  UNASSIGNED=unassignedOf(inStore(future));
  paintTabBadge();
  const byDate={};inStore(month).filter(calMatch).filter(calCourseMatch).forEach(r=>(byDate[r.date]=byDate[r.date]||[]).push(r));
  /* 月のお休み（1日まとめての休みだけカレンダーに出す） */

  const blkByDate={};inStore(monthBlocks).forEach(b=>(blkByDate[b.date]=blkByDate[b.date]||[]).push(b));
  Object.values(byDate).forEach(a=>a.sort((x,y)=>x.hour-y.hour));

  /* 月のマス目。前後の月の日も薄く出す（6 週固定） */
  const [y,m]=calYM.split('-').map(Number);
  const gridStart=new Date(y,m-1,1-first.getDay());
  let cells='';
  for(let i=0;i<42;i++){
    const d=new Date(gridStart); d.setDate(gridStart.getDate()+i);
    const ds=fmtDate(d), out=d.getMonth()!==m-1, dow=d.getDay();
    const rs=byDate[ds]||[];
    const cls=['tt-cell',out?'out':'',ds===todayS?'today':'',ds===selDate?'sel':'',dow===0?'sun':'',dow===6?'sat':''].filter(Boolean).join(' ');
    const bl=blkByDate[ds]||[];
    const shopOff=bl.length&&storeClosedAllDay(bl);
    const offs=shopOff?[]:TRAINERS.filter(t=>bl.length&&trainerOffAllDayOnly(bl,t.id)&&(calFilter==='all'||calFilter===t.id));
    const hol=(shopOff?'<div class="ev hol">休業</div>':'')+
      offs.map(t=>`<div class="ev hol-t" style="border-color:${t.color};color:${t.color}">${esc(t.name.replace(/トレーナー$/,''))} 休</div>`).join('');
    const evs=rs.slice(0,3).map(r=>`<div class="ev" style="background:${evColor(r)}">${esc(evLabel(r))}</div>`).join('');
    const more=rs.length>3?`<div class="more">+${rs.length-3}</div>`:'';
    cells+=`<div class="${cls}${shopOff?' closed':''}" onclick="calPick('${ds}')"><div class="d">${d.getDate()}</div>${hol}${evs}${more}</div>`;
  }
  let html=`${USE_STORES?`<div class="chips" style="margin:0 0 12px">${storeChips(curStore,'pickStore')}</div>`:''}` + `${USE_COURSES?`<div class="chips bigchips" style="margin:0 0 12px">${courseChips(calCourse,'pickCalCourse',true)}</div>`:''}${UNASSIGNED.length?`<div class="todo" onclick="openUnassigned()">
      <div><div class="ttl">担当が決まっていない予約</div>
        <div class="meta">タップすると、その場で決められます</div></div>
      <div class="n">${UNASSIGNED.length}件</div>
    </div>`:''}
    <div class="tt">
    <div class="tt-head"><b>${y}年${m}月</b>
      <div class="nav"><button onclick="ttToday()">今日</button><button onclick="ttMove(-1)" aria-label="前の月">‹</button><button onclick="ttMove(1)" aria-label="次の月">›</button></div></div>

/* 選んだ日の休みを1行で（カードの見出しの下に出す） */
function holidayLine(blocks){
  if(!blocks||!blocks.length) return '';
  const all=slotHours();
  /* 続いた時間はまとめる（10,11,12 → 10:00〜13:00） */
  const span=hs=>{
    hs=[...new Set(hs)].sort((a,b)=>a-b);
    if(all.every(h=>hs.includes(h))) return '終日';
    const out=[];let st=null,pv=null;
    hs.forEach(h=>{ if(st===null){st=pv=h;return;} if(h===pv+1){pv=h;return;} out.push([st,pv]);st=pv=h; });
    if(st!==null) out.push([st,pv]);
    return out.map(([a,b])=>`${hhmm(a)}〜${hhmm(b+STEP_H)}`).join('、');
  };
  const rows=[];
  /* お店全体 */
  const shopHours=all.filter(h=>blockedAll(blocks,h));
  if(shopHours.length){
    const m=shopHours.length===all.length?dayMemo(blocks,null):'';
    rows.push({who:'お店',when:span(shopHours),memo:m});
  }
  /* トレーナー。休みの時間が同じ人はまとめる（お店の休みと重なる時間は除く） */
  const groups={};
  TRAINERS.forEach(t=>{
    const hs=all.filter(h=>!blockedAll(blocks,h)&&blockedIds(blocks,h).has(t.id));
    if(!hs.length) return;
    const key=span(hs);
    (groups[key]=groups[key]||[]).push(t.name.replace(/トレーナー$/,''));
  });
  Object.entries(groups).forEach(([when,names])=>rows.push({who:names.join('・')+'トレーナー',when}));
  return rows.map(r=>`<div class="hol-item"><b>${esc(r.who)}</b><span>${r.when==='終日'?'終日お休み':r.when+' お休み'}${r.memo?`（${esc(r.memo)}）`:''}</span></div>`).join('');
}
/* お休みの設定（日付を選んでから開く）。1日まとめて／時間ごと */
async function openHoliday(date){

  const storeOff=storeClosedAllDay(blocks);

  const dayRows=[
    ...(storeOff?[{tid:null,label:'お店の休み',memo:dayMemo(blocks,null)}]:[]),
    ...offTrainers.map(t=>({tid:t.id,label:t.name+'の休み',memo:dayMemo(blocks,t.id)}))
  ];
  const slots=slotHours().map(h=>{

    ${dayRows.map(d=>`<div class="row"><div><div class="ttl">${esc(d.label)}</div>${d.memo?`<div class="meta">${esc(d.memo)}</div>`:''}</div>

/* 休みにする人を選ぶ欄。お店全体を選ぶと、トレーナーの選択は外れる（逆も同じ）。
   already に入っている休みは、選べないようにして「休み中」と出す */
function whoPicker(id,storeLabel,already){
  const has=tid=>(already||[]).some(b=>(b.trainer_id||null)===tid);
  const item=(val,label,color)=>{
    const done=has(val||null);
    return `<label class="pick ${done?'done':''}">
      <input type="checkbox" value="${val}" ${done?'disabled':''} onchange="pickWho('${id}',this)">
      ${color?`<i class="tdot" style="background:${color}"></i>`:''}<span>${esc(label)}</span>${done?'<span class="pick-now">休み中</span>':''}</label>`;
  };
  return `<div class="pick-list" id="${id}">${item('',storeLabel,'')}<div class="pick-sep"></div>${TRAINERS.map(t=>item(t.id,t.name,t.color)).join('')}</div>`;
}
function pickWho(id,el){
  if(!el.checked) return;
  const boxes=[...document.querySelectorAll(`#${id} input`)];
  if(el.value===''){ boxes.forEach(b=>{ if(b!==el) b.checked=false; }); }
  else { boxes.filter(b=>b.value==='').forEach(b=>b.checked=false); }
}
/* 選ばれた人（お店全体は null） */
function readWho(id){
  return [...document.querySelectorAll(`#${id} input:checked`)].map(b=>b.value||null);
}
function whoLabel(who){
  if(who.includes(null)) return 'お店全体';
  const names=who.map(t=>trainerName(t).replace(/トレーナー$/,''));
  return names.length>2?`${names.slice(0,2).join('・')}ほか${names.length-2}人`:names.join('・');
}

  sendMail('cancelled',{userId:r.user_id,date:r.date,hour:r.hour,trial:r.trial,refund,store:storeIdOf(r)});
  if(refund){
    if(r.trial) await sb.from('profiles').update({trial_used:false}).eq('id',r.user_id);
    else await refundTicket(r.user_id,usedOf(r),'店側都合の取消',courseIdOf(r));
    for(const p of (r.reservation_participants||[])) await refundTicket(p.user_id,1,'店側都合の取消',courseIdOf(r));
  }
  closeOv();
  toast(refund?'取り消し、返却しました':'取り消しました（返却なし）');
  render();
}

/* 名前・フリガナでの絞り込み（ひらがな/カタカナの違いも吸収） */
function kataToHira(s){return (s||'').replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));}
/* 検索中は「スタッフ」「会員」に分けず、1つの検索結果にまとめて出す */
function filterMembers(q){
  const raw=q.trim();
  MEM_Q=raw;
  const key=kataToHira(raw.toLowerCase()).replace(/[\s　]/g,'');
  const res=document.getElementById('mResult');
  const secs=[...document.querySelectorAll('.m-sec')];
  const clear=document.getElementById('mClear');
  if(!res) return;
  if(!key){
    res.classList.add('hide'); res.innerHTML='';
    secs.forEach(s=>s.classList.remove('hide'));
    if(clear) clear.classList.add('hide');
    return;
  }
  secs.forEach(s=>s.classList.add('hide'));
  if(clear) clear.classList.remove('hide');
  const hits=MEM_CACHE.filter(m=>kataToHira(String(m.name||'').toLowerCase()).replace(/[\s　]/g,'').includes(key));
  res.classList.remove('hide');
  res.innerHTML=`<div class="card"><h2>「${esc(raw)}」の検索結果 <span class="pill">${hits.length}件</span></h2>
    ${hits.length
      ? hits.map(m=>memberRow(m,true)).join('')
      : `<div class="empty">「${esc(raw)}」に一致する方がいません</div>`}
  </div>`;
}

}

async function saveLessonNote(uid,id){

/* どこから登録された方かの印。古い会員（印が無い方）は何も出さない */
const VIA_LABEL={ 'new':'新規', 'exist':'既存', 'guest':'体験申込', 'ledger':'台帳' };
function joinedVia(m){
  return m.joined_via || (m.ledger?'ledger':(m.guest?'guest':''));
}
function viaPill(m){
  const t=VIA_LABEL[joinedVia(m)];
  return t?`<span class="pill">${t}</span>`:'';
}
function memberRow(m,withRole){
  const isStaff=m.role==='admin';
  /* スタッフの詳細（チケット・ヒアリング・写真）は開かない。会員だけタップできる */
  const tapOK=!isStaff && m.id!==me.id;
  const role=withRole?(isStaff?'<span class="pill">スタッフ</span>':'<span class="pill">会員</span>'):'';
  const ownerPill=(isStaff && m.id===OWNER_UID)?'<span class="pill">オーナー</span>':'';
  const leftPill=m.left_at?'<span class="pill">退会</span>':(m.paused_at?'<span class="pill">休会中</span>':'');
  const name=`<div class="ttl"><span class="m-name">${esc(m.name)}</span> ${role}${ownerPill}${leftPill}${viaPill(m)}${m.id===me.id?'<span class="pill fill">あなた</span>':''}</div>`;

  }

function staffRank(m){
  if(OWNER_UID && m.id===OWNER_UID) return 0;
  if(me && m.id===me.id) return 1;
  return 2;
}
async function adminMembersView(){
  const todayS=fmtDate(new Date());
  const [{ data:all },{ data:resv }]=await Promise.all([
    sb.from('profiles').select('*').order('role').order('name'),
    sb.from('reservations').select('*'),
  ]);
  MEM_CACHE=all||[];
  /* 前回利用日（今日より前の最新の予約）と次回予約（今日以降の最初の予約） */
  MEM_INFO={};
  (resv||[]).forEach(r=>{
    const key=r.date+String(r.hour).padStart(2,'0');
    const i=(MEM_INFO[r.user_id]=MEM_INFO[r.user_id]||{});
    if(r.date>=todayS){ if(!i.next||key<i.nextKey){ i.next=r; i.nextKey=key; } }
    else { if(!i.last||key>i.lastKey){ i.last=r; i.lastKey=key; } }
  });
  /* スタッフはオーナーを先頭に。その次は自分、あとは名前順 */
  const staff=MEM_CACHE.filter(m=>m.role==='admin' && (!USE_STORES || storeIdOf(m)===curStore))
    .sort((x,y)=>staffRank(x)-staffRank(y));
  /* 退会にした方は、下の折りたたみにまとめる（データは残る） */
  const mems=MEM_CACHE.filter(m=>m.role!=='admin');

  /* まだ所属が決まっていない方（体験に来られた方など） */
  const noStore=USE_STORES ? mems.filter(m=>!m.left_at && !m.store) : [];

      <p class="small" style="margin-bottom:6px">カルテを開いて、所属する店舗を選んでください。</p>

      <div style="margin-top:10px">${left.map(m=>memberRow(m,false)).join('')}</div>

/* 退会の切り替え（トレーナー）。データは消さず、一覧の並びから外すだけ */
/* 会員の状態を変える（トレーナー）。記録は消さず、扱いだけを変える。
     active … 通常
     pause  … 一時退会（休会）。会員一覧には「休会中」として残る
     left   … 退会。一覧の下の折りたたみに移る */
async function setStatus(uid,st){
  const msg={
    pause:'この方を一時退会（休会）にします。\n会員一覧には「休会中」として残ります。よろしいですか？',
    left :'この方を退会にします。\n会員一覧から外れます（記録は残り、いつでも戻せます）。よろしいですか？',
    active:'この方を通常の会員に戻します。よろしいですか？',
  }[st];
  const label={pause:'一時退会にする',left:'退会にする',active:'通常に戻す'}[st];
  if(!(await askConfirm(msg,label,st!=='active'))) return;
  const now=new Date().toISOString();
  const patch={
    left_at : st==='left' ? now : null,
    paused_at: st==='pause' ? now : null,
  };
  const { error } = await sb.from('profiles').update(patch).eq('id',uid);
  if(error){ toast('エラー: '+(error.message||'変更できませんでした')); return; }
  toast({pause:'一時退会にしました',left:'退会にしました',active:'通常に戻しました'}[st]);
  closeOv(); render();
}

let _uploadTarget=null;
function triggerUpload(uid,key){
  _uploadTarget={uid,key};
  let inp=document.getElementById('photoInput');
  if(!inp){
    inp=document.createElement('input');
    inp.type='file'; inp.accept='image/*'; inp.id='photoInput';
    inp.style.display='none';
    inp.addEventListener('change',handlePhotoPick);
    document.body.appendChild(inp);
  }
  inp.value='';
  inp.click();
}

async function handlePhotoPick(e){
  const file=e.target.files[0];
  if(!file||!_uploadTarget)return;
  const {uid,key}=_uploadTarget;
  toast('画像を処理中…');
  try{
    /* 保存先は Firestore で、1件およそ 1MB まで。
       カルテを開くと、その会員の写真を本体ごと読み込む。
       枚数が増えても待たされないよう、1枚あたり 350KB までに抑える。
       紙のカルテは手書きの字を読むので、他の写真より大きめから試す */
    const big = key==='chart';
    const cap = 350000;
    const steps = big
      ? [[1500,0.75],[1300,0.68],[1100,0.6],[900,0.52]]
      : [[1100,0.7],[850,0.6],[700,0.5]];
    let blob=null;
    for(const [px,q] of steps){
      blob=await compressImage(file,px,q);
      if(blob.size<=cap) break;
    }
    let fname;
    if(key==='progress'||key==='chart'){
      const d=new Date().toISOString().slice(0,10);
      fname=`${key}_${d}_${Date.now()}.jpg`;
    }else{
      fname=`${key}.jpg`; // 靴・顔は固定名で上書き
    }
    const path=`${uid}/${fname}`;
    const { error } = await sb.storage.from(PHOTO_BUCKET).upload(path,blob,{upsert:true,contentType:'image/jpeg'});
    if(error)throw error;
    toast('写真を保存しました');
    if(profile.role==='admin') loadMemberPhotos(uid); else loadMyPhotos();
  }catch(err){
    toast('エラー: '+(err.message||'保存に失敗しました'));
  }
}

/* 画像圧縮：長辺maxPxに縮小しJPEG品質qで出力 */
function compressImage(file,maxPx,q){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      URL.revokeObjectURL(url);
      let {width:w,height:h}=img;
      if(w>h&&w>maxPx){h=Math.round(h*maxPx/w);w=maxPx;}
      else if(h>=w&&h>maxPx){w=Math.round(w*maxPx/h);h=maxPx;}
      const cv=document.createElement('canvas');
      cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      cv.toBlob(b=>b?resolve(b):reject(new Error('圧縮失敗')),'image/jpeg',q);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('画像を読み込めません'));};
    img.src=url;
  });
}

async function setTickets(uid,value,cid){
  value=parseInt(value);
  if(isNaN(value)||value<0){toast('0以上の枚数を入力してください');return;}
  cid=cid||DEFAULT_COURSE;
  const f=tkField(cid);
  const { data:p } = await sb.from('profiles').select('*').eq('id',uid).single();
  const cur=Number(p[f])||0;
  const delta=value-cur;
  if(delta===0){toast('枚数に変更がありません');return;}
  await sb.from('profiles').update({[f]:value}).eq('id',uid);
  await sb.from('ticket_history').insert({user_id:uid,delta,memo:`枚数修正（${cur}→${value}）`,by_admin:true,...courseTag(cid)});
  toast(`${p.name}さん：${USE_COURSES?courseName(cid)+' ':''}${value}枚に修正`);
  const c=MEM_CACHE.find(m=>m.id===uid); if(c) c[f]=value;
  document.querySelectorAll(`.m-row[data-uid="${uid}"] .tk-now[data-c="${cid}"]`).forEach(el=>{ el.textContent=value; });
  const ovOpen=document.getElementById('ov').classList.contains('show');
  if(ovOpen)openMemberDetail(uid);
  else render();
}

  /* 本当に保存されたか、保存先から読み直して画面に出す */
  const { data } = await sb.from('settings').select('*').eq('id','staff').maybeSingle();
  const saved=(data&&typeof data.code==='string')?data.code:'';
  const box=document.getElementById('staffNow');
  if(box){ box.innerHTML=staffNowHtml(saved,data&&data.updated_at); box.classList.remove('dirty'); }
  const btn=document.getElementById('staffSaveBtn'); if(btn) btn.textContent='合言葉を保存する';
  if(saved!==code){ toast('保存できませんでした。もう一度お試しください'); return; }
  toast(saved?`合言葉を「${saved}」に保存しました`:'合言葉を消しました（合言葉では登録できません）');
}
async function saveSettings(){
  const o=+document.getElementById('setOpen').value;
  const c=+document.getElementById('setClose').value;
  /* 営業日は config.js の defaultSettings.weekdaysOnly で決まる（画面では変えない） */
  const wd=SHOP_WEEKDAYS_ONLY;
  const mp=+((document.getElementById('setParty')||{}).value||SETTINGS.maxParty);
  if(c<=o){toast('終了は開始より後にしてください');return;}
  await sb.from('settings').upsert({id:1,open_hour:o,close_hour:c,weekdays_only:wd,max_party:mp});
  SETTINGS={openHour:o,closeHour:c,weekdaysOnly:wd,maxParty:mp};
  toast('保存しました');render();
}

/* ---------- 共通UI ---------- */
/* 下から出る画面を開いている間、後ろの画面が動かないようにする。
   開いた位置を覚えておき、閉じたら元の位置に戻す */
let lockN=0, lockY=0;
function lockScroll(on){
  const body=document.body;
  if(on){
    lockN++;
    if(lockN>1) return;
    lockY=window.scrollY||window.pageYOffset||0;
    body.style.position='fixed';
    body.style.top=(-lockY)+'px';
    body.style.left='0';
    body.style.right='0';
    body.style.width='100%';
  }else{
    lockN=Math.max(0,lockN-1);
    if(lockN>0) return;
    body.style.position='';
    body.style.top='';
    body.style.left='';
    body.style.right='';
    body.style.width='';
    window.scrollTo(0,lockY);
  }
}
function openOv(full){
  const el=document.getElementById('ov');
  const sheet=el.querySelector('.sheet');
  if(sheet){ sheet.classList.toggle('full', !!full); sheet.scrollTop=0; }
  if(el.classList.contains('show')) return;   /* 中身だけ差し替えたときは数えない */
  el.classList.add('show');
  lockScroll(true);
}
function closeOv(){
  const el=document.getElementById('ov');
  if(el.classList.contains('show')) lockScroll(false);
  el.classList.remove('show');
}
document.getElementById('ov').addEventListener('click',e=>{if(e.target.id==='ov')closeOv();});
/* 確認ダイアログ。OK → true / やめる・枠の外をタップ → false */
function askConfirm(msg, okLabel, danger){
  return new Promise(resolve=>{
    const ov=document.getElementById('ask');
    const ok=document.getElementById('askOk');
    const no=document.getElementById('askNo');
    document.getElementById('askMsg').textContent=msg;
    ok.textContent=okLabel||'OK';
    ok.className='btn'+(danger?' danger':'');
    /* 二重に開いても数がずれないよう、開いていたときだけ戻す */
    const done=v=>{ if(ov.classList.contains('show')) lockScroll(false); ov.classList.remove('show'); ov.onclick=ok.onclick=no.onclick=null; resolve(v); };
    ok.onclick=()=>done(true);
    no.onclick=()=>done(false);
    ov.onclick=e=>{ if(e.target===ov) done(false); };
    if(!ov.classList.contains('show')){ ov.classList.add('show'); lockScroll(true); }
  });
}
/* 保存に失敗したときは、成功したように見せずに知らせる */
window.addEventListener('unhandledrejection',e=>{
  console.error(e.reason);
  toast('保存できませんでした。通信状況を確認して、もう一度お試しください');
});
let toastT;
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2400);}
</script>
