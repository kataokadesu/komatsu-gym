<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light">
<!-- ホーム画面に追加したときにアプリとして開くための設定。
     店舗ごとに変わるのは manifest.json と icons/ の中身だけ。 -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>予約・チケット管理</title>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
<!-- 店舗ごとの設定。導入時に書き換えるのはこのファイルだけです -->
<script src="config.js"></script>
<script>
  /* config.js の theme を CSS 変数に流し込む。
     描画前に当てることで、既定色が一瞬見える現象を防ぐ。
     theme を書いていない古い config.js では下の :root の既定値がそのまま使われる。 */
  (function(){
    var t = (typeof SHOP !== "undefined" && SHOP.theme) || {};
    var root = document.documentElement;
    Object.keys(t).forEach(function(k){ if(t[k]) root.style.setProperty("--"+k, t[k]); });
    if(t.paper){
      var m = document.createElement("meta");
      m.name = "theme-color"; m.content = t.paper;
      document.head.appendChild(m);
    }
    if(typeof SHOP !== "undefined" && SHOP.name){
      var t2 = document.createElement("meta");
      t2.name = "apple-mobile-web-app-title"; t2.content = SHOP.name;
      document.head.appendChild(t2);
    }
  })();
</script>
<style>
  :root{
    color-scheme: light only;
    --ink:#0a0a0a;
    --paper:#ffffff;
    --smoke:#f4f4f5;
    --line:#e4e4e7;
    --muted:#71717a;
    --danger:#dc2626;
    --ok:#16a34a;
    --serif:"Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;color-scheme:light;background:var(--paper)}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    background:var(--paper);color:var(--ink);line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  /* ===== スプラッシュ ===== */
  #splash{position:fixed;inset:0;background:var(--paper);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .5s ease}
  #splash.bye{opacity:0;pointer-events:none}
  .sp-logo{position:relative;width:150px;height:150px}
  .sp-logo svg{position:absolute;inset:0;width:100%;height:100%;color:var(--ink)}
  .sp-ring{fill:none;stroke:currentColor;stroke-width:6.5;stroke-dasharray:289;stroke-dashoffset:289;transform-origin:center;transform:rotate(-90deg);animation:draw .9s cubic-bezier(.5,0,.2,1) .15s forwards}
  .sp-ring2{fill:none;stroke:currentColor;stroke-width:2.6;stroke-dasharray:233;stroke-dashoffset:233;transform-origin:center;transform:rotate(-90deg);animation:draw .8s cubic-bezier(.5,0,.2,1) .4s forwards}
  .sp-arm{position:absolute;inset:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.7);animation:armin .55s cubic-bezier(.2,.9,.3,1.2) .95s forwards}
  .sp-arm img{width:64%;height:64%;object-fit:contain}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes armin{to{opacity:1;transform:scale(1)}}
  @keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .sp-name{font-family:var(--serif);font-size:34px;font-weight:600;letter-spacing:.14em;opacity:0;animation:fadeup .7s ease 1.35s forwards}
  .sp-tag{font-size:10px;letter-spacing:.45em;color:var(--muted);opacity:0;animation:fadeup .7s ease 1.55s forwards;margin-top:-8px}
  /* マークを置かない店舗: 待たせずに店名を出す */
  #splash.nomark .sp-name{animation-delay:.15s}
  #splash.nomark .sp-tag{animation-delay:.35s}
  /* ===== ブランドヘッダー ===== */
  header.brand{
    border-bottom:2px solid var(--ink);
    padding:14px 18px;display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;background:var(--paper);z-index:50;
  }
  .logo{display:flex;align-items:center;gap:9px;font-weight:900;letter-spacing:-.02em}
  .komatsu-logo{display:block;width:100%;height:100%;object-fit:contain}
  /* ロゴを伏せるとき（demoBlank）の四角。入る場所と大きさが分かるようにする */
  .logo-ph{display:flex;align-items:center;justify-content:center;text-align:center;
    width:100%;height:100%;border:1.5px dashed currentColor;border-radius:10px;
    font-size:10px;font-weight:700;line-height:1.4;letter-spacing:0;opacity:.7;padding:4px}
  /* 上の帯は狭いので「ロゴ」とだけ出す */
  .logo .logo-ph{width:54px;height:32px;font-size:0}
  .logo .logo-ph::after{content:"ロゴ";font-size:9px;letter-spacing:.06em}
  /* チケットの飾りロゴは、伏せるときは出さない */
  .ticket-banner .tkt-logo .logo-ph{display:none}
  .auth-logo .logo-ph{width:150px;height:96px;margin:0 auto;font-size:12px}
  .sp-arm .logo-ph{width:120px;height:70px;font-size:11px}
  .logo .komatsu-logo{width:46px;height:46px}
  .auth-logo .komatsu-logo{width:150px;height:150px;margin:0 auto}
  .logo .big{font-size:21px}
  .logo .tag{font-size:10px;font-weight:700;letter-spacing:.22em;color:var(--muted);margin-left:4px}
  .who{font-size:12px;color:var(--muted);text-align:right}
  .who b{display:block;color:var(--ink);font-size:13px}
  /* ===== レイアウト ===== */
  main{max-width:760px;margin:0 auto;padding:20px 16px calc(110px + env(safe-area-inset-bottom))}
  .card{border:1.5px solid var(--ink);border-radius:14px;padding:18px;margin-bottom:16px;background:var(--paper)}
  .card h2{font-size:13px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .card h2::before{content:"";width:10px;height:10px;background:var(--ink);border-radius:2px;display:inline-block}
  /* ===== 挨拶＆チケットバナー ===== */
  .hello{font-family:var(--serif);font-size:21px;font-weight:600;margin:2px 2px 12px;letter-spacing:.04em}
  .hello .nx{display:block;font-family:inherit;font-size:13px;color:var(--muted);font-weight:500;margin-top:6px;line-height:1.6;letter-spacing:.02em}
  /* 担当は次回の予約の下の行に出す（スマホで途中で折れないように） */
  .hello .nx-tr{display:block}
  .ticket-banner{
    background:var(--ink);color:var(--paper);border-radius:14px;padding:20px;margin-bottom:16px;
    display:flex;align-items:center;justify-content:space-between;position:relative;overflow:hidden;
  }
  .ticket-banner .num{font-size:46px;font-weight:900;line-height:1;letter-spacing:-.03em}
  .ticket-banner .lbl{font-size:11px;letter-spacing:.2em;color:#a1a1aa}
  .ticket-banner .tkt-logo{position:absolute;right:-10px;bottom:-18px;width:108px;height:108px;opacity:.14}
  .ticket-banner .tkt-logo img{width:100%;height:100%;object-fit:contain}
  .ticket-banner>div{position:relative;z-index:1}
  /* ===== ボタン ===== */
  button{font-family:inherit;cursor:pointer;border:none;font-weight:700}
  .btn{background:var(--ink);color:var(--paper);padding:13px 18px;border-radius:10px;font-size:15px;width:100%;transition:transform .08s,opacity .15s}
  .btn:active{transform:scale(.98)}
  .btn:disabled{opacity:.35;cursor:not-allowed}
  .btn.ghost{background:var(--paper);color:var(--ink);border:1.5px solid var(--ink)}
  .btn.sm{width:auto;padding:8px 14px;font-size:13px;border-radius:8px;white-space:nowrap;flex-shrink:0}
  .btn.danger{background:var(--danger)}
  .btn.row{margin-top:0;justify-content:center}
  /* 会員の名前はタップで詳細が開く。押せると分かるよう「詳細 ›」に色を付け、触れると背景が変わる */
  .m-link{cursor:pointer;border-radius:8px;margin:-6px -8px;padding:6px 8px;transition:background .15s}
  .m-link .m-more{color:var(--ok);font-weight:700}
  .m-link:hover,.m-link:focus-visible{background:var(--smoke);outline:none}
  .m-link:active{background:var(--line)}
  /* 会員一覧の、残チケットの表示（ここでは変えられない。変更は詳細画面から） */
  .tk-view{flex-shrink:0;text-align:center;min-width:64px}
  .tk-view .tk-lbl{font-size:10px;color:var(--muted);letter-spacing:.04em}
  .tk-view .tk-num{font-size:20px;font-weight:900;line-height:1.1}
  .tk-view .tk-num span{font-size:11px;font-weight:700;margin-left:1px}
  .m-row .meta+.meta{margin-top:2px}
  /* ログイン画面の「パスワードをお忘れの方」 */
  .forgot{text-align:right;margin-top:8px}
  .forgot a{font-size:12px;color:var(--muted);text-decoration:underline;cursor:pointer}
  #rsMsg{white-space:pre-line}
  /* 設定画面の説明（手順と注意を分けて読みやすく） */
  .guide{font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:14px}
  .guide-ttl{font-weight:700;color:var(--ink);margin:10px 0 4px}
  .guide-ttl:first-child{margin-top:0}
  .guide ol,.guide ul{margin:0;padding-left:1.4em}
  .guide li+li{margin-top:4px}
  .guide-note{margin-top:6px}
  /* ===== フォーム ===== */
  label.fld{display:block;font-size:12px;font-weight:700;letter-spacing:.05em;margin:12px 0 5px;color:var(--muted)}
  /* 入力欄の文字は16px以上にする。小さいと iPhone が押したときに画面を拡大してしまう */
  input,select,textarea{
    width:100%;padding:12px;border:1.5px solid var(--line);border-radius:9px;font-size:16px;font-family:inherit;background:var(--paper);color:var(--ink);
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink)}
  textarea{min-height:70px;resize:vertical}
  /* 姿勢分析の撮影日。iPhone の日付入力は中身より狭くできず、枠からはみ出すので抑える。
     posture.js のあとに読まれても効くよう、id で指定する */
  .pc-meta>div{min-width:0}
  #pc-date{width:100%;max-width:100%;min-width:0}
  /* ===== タブ ===== */
  /* 下のタブ。絵文字は使わず、選んでいるタブを塗りつぶして示す */
  nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--paper);border-top:2px solid var(--ink);display:flex;gap:6px;
    /* iPhone の下のホームバーに重ならないよう、下に余白をとる */
    padding:8px 8px max(16px, calc(10px + env(safe-area-inset-bottom)));z-index:50}
  nav.tabs button{flex:1;background:none;padding:11px 4px;font-size:14px;font-weight:700;letter-spacing:0;line-height:1.2;
    color:var(--muted);border-radius:11px;white-space:nowrap}
  nav.tabs button.on{background:var(--ink);color:var(--paper)}
  /* 「予約状況」に付く赤い数字＝担当が決まっていない予約の件数 */
  nav.tabs button .tbadge{display:inline-block;min-width:19px;height:19px;line-height:19px;padding:0 5px;margin-left:5px;
    border-radius:10px;background:var(--danger);color:#fff;font-size:11px;font-weight:800;vertical-align:1px}
  nav.tabs button.on .tbadge{background:var(--paper);color:var(--danger)}
  /* 担当が決まっていない予約の帯（予約状況の一番上） */
  .todo{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;
    border:1.5px solid var(--danger);border-radius:14px;padding:13px 15px;margin-bottom:12px;background:var(--paper)}
  .todo .ttl{font-weight:800;font-size:15px;color:var(--danger)}
  .todo .meta{font-size:12px;color:var(--muted);margin-top:2px}
  .todo .n{flex:0 0 auto;font-size:18px;font-weight:900;color:var(--danger)}
  /* ===== 店舗を選ぶカード ===== */
  /* 店舗は横に2つ並べる（下へのスクロールを減らす） */
  .store-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:stretch;margin:2px 0 6px}
  .store-card{display:flex;flex-direction:column;width:100%;text-align:left;padding:0;overflow:hidden;
    background:var(--paper);border:1.5px solid var(--line);border-radius:13px;cursor:pointer;
    transition:border-color .15s ease}
  /* 2枚の高さをそろえる（写真は同じ形に切りそろえる） */
  .store-card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--smoke)}
  .store-card .sc-body{padding:8px 10px 10px;flex:1;display:flex;flex-direction:column;justify-content:center}
  .store-card .sc-name{font-weight:700;font-size:13.5px;color:var(--ink);line-height:1.4}
  .store-card .sc-addr{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.6}
  .store-card.sel{border-color:var(--ink);border-width:2px}
  .store-card.sel .sc-name::after{content:"　選択中";font-size:10px;color:var(--ok);white-space:nowrap}
  /* ===== 予約スロット ===== */
  .daybar{display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
  .daybar button{flex:0 0 auto;border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 12px;text-align:center;min-width:58px}
  .daybar button.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}
  .daybar .dow{font-size:10px;color:inherit;opacity:.7}
  .daybar .dnum{font-size:18px;font-weight:900}
  /* 月ごとのカレンダー */
  .mcal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .mcal-head b{font-size:16px;font-weight:900;letter-spacing:.04em}
  .mcal-head button{width:40px;height:36px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font-size:18px;font-weight:700}
  .mcal-head button:disabled{opacity:.25}
  .mcal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .mcal-grid .w{font-size:10px;text-align:center;color:var(--muted);padding:2px 0}
  .mcal-grid button{height:42px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font-size:15px;font-weight:700;padding:0}
  .mcal-grid button.today{border-color:var(--ink)}
  .mcal-grid button.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
  .mcal-grid button:disabled{border-color:transparent;background:transparent;color:var(--muted);opacity:.45;font-weight:500}
  /* 日曜は赤、土曜は青（選んでいる日は白文字のまま） */
  .mcal-grid .w.sun,.mcal-grid button.sun:not(.on){color:#D9534F}
  .mcal-grid .w.sat,.mcal-grid button.sat:not(.on){color:#4A78C2}
  .mcal-note{font-size:11px;color:var(--muted);margin:8px 0 14px}
  .slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .slot{border:1.5px solid var(--line);border-radius:10px;padding:12px 6px;text-align:center;background:var(--paper)}
  .slot .t{font-size:16px;font-weight:900}
  .slot .s{font-size:10px;color:var(--muted);margin-top:2px}
  .slot.open{cursor:pointer}
  .slot.open:active{border-color:var(--ink)}
  .slot.mine{border-color:var(--ink);background:var(--smoke)}
  .slot.taken{opacity:.45}
  .slot.joinable{border-color:var(--ink);border-style:dashed;cursor:pointer}
  /* ===== トレーナーのカレンダー（TimeTree 風） ===== */
  .tt{background:var(--paper);border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
  .tt-head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line)}
  .tt-head b{font-size:17px;font-weight:900;letter-spacing:.03em}
  .tt-head .nav{display:flex;gap:6px;align-items:center}
  .tt-head .nav button{height:32px;min-width:32px;padding:0 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font-size:13px;font-weight:700}
  .tt-dow{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line)}
  .tt-dow div{font-size:10px;text-align:center;color:var(--muted);padding:5px 0;font-weight:700}
  .tt-dow .sun,.tt-cell.sun .d{color:#D9534F}
  .tt-dow .sat,.tt-cell.sat .d{color:#4A78C2}
  .tt-grid{display:grid;grid-template-columns:repeat(7,1fr)}
  .tt-cell{min-height:66px;padding:3px 2px 4px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:2px}
  .tt-cell:nth-child(7n){border-right:none}
  .tt-cell.out{opacity:.35}
  .tt-cell.sel{background:var(--smoke)}
  .tt-cell .d{font-size:11px;font-weight:700;text-align:center;line-height:18px;height:18px;width:18px;border-radius:50%;margin:0 auto 1px}
  .tt-cell.today .d{background:var(--ink);color:var(--paper)!important}
  /* 休みにする人の選択 */
  .pick-list{border:1.2px solid var(--line);border-radius:10px;padding:2px 12px;background:var(--paper)}
  .pick{display:flex;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer}
  .pick:last-child{border-bottom:none}
  .pick input{width:20px;height:20px;margin:0;flex-shrink:0;accent-color:#0a0a0a;cursor:pointer}
  .pick .tdot{margin-right:0}
  .pick.done{opacity:.45;cursor:default}
  .pick-now{margin-left:auto;font-size:11px;color:var(--muted)}
  .pick-sep{height:0;border-bottom:1.5px solid var(--line);margin:0 -12px}
  /* マイページのチケット履歴 */
  .th-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
  .th-row:last-child{border-bottom:none}
  .th-list{max-height:340px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-right:4px}
  .th-main{min-width:0;flex:1}
  .th-date{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--muted)}
  .th-date .pill{margin-left:0}
  .th-memo{font-size:14px;font-weight:700;color:var(--ink);margin-top:5px;line-height:1.5}
  .th-delta{font-size:22px;font-weight:900;white-space:nowrap;flex-shrink:0;letter-spacing:.02em}
  .th-delta small{font-size:12px;font-weight:700;margin-left:2px}
  .th-delta.plus{color:var(--ink)}
  .th-delta.minus{color:var(--muted)}
  /* 利用契約書の同意欄。読むまではうすく表示する */
  .agree-row{display:flex;align-items:flex-start;gap:9px;margin-top:11px;font-size:13px;line-height:1.5;cursor:pointer}
  .agree-row.locked{opacity:.45}
  /* 通信中に画面の上に出す細い線（すぐ終わる通信では出さない） */
  #busyBar{position:fixed;top:0;left:0;right:0;height:3px;z-index:999;pointer-events:none;opacity:0;transition:opacity .15s;
    background:linear-gradient(90deg,transparent 0%,var(--ink) 50%,transparent 100%);background-size:40% 100%;background-repeat:no-repeat;
    animation:busyMove 1s linear infinite}
  #busyBar.on{opacity:1}
  @keyframes busyMove{from{background-position:-40% 0}to{background-position:140% 0}}
  .btn.is-busy{opacity:.7;cursor:wait}
  /* お休みの印 */
  .tt-cell.closed{background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(0,0,0,.035) 6px 12px)}
  .tt-cell .ev.hol{background:var(--muted)}
  .tt-cell .ev.hol-t{background:var(--paper);border:1px solid}
  .tt-day-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
  .tt-day-head h2{margin:0;min-width:0}
  .tt-day-head .pill{white-space:nowrap}
  .hol-line{font-size:13px;color:var(--ink);background:var(--smoke);border-radius:8px;padding:6px 12px;margin-bottom:8px}
  .hol-item{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;padding:4px 0}
  .hol-item+.hol-item{border-top:1px solid var(--line)}
  .hol-item b{font-weight:700}
  .tt-cell .ev{font-size:9.5px;line-height:1.35;color:#fff;font-weight:700;border-radius:3px;padding:1px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tt-cell .more{font-size:9px;color:var(--muted);text-align:center;font-weight:700}
  .tt-day{margin-top:14px}
  /* 1件あたりの高さをそろえて、件数が増えても見やすくする（長い内容は … で省略） */
  .tt-row{display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px solid var(--line);cursor:pointer}
  .tt-row:last-child{border-bottom:none}
  .tt-row .tm{width:44px;font-size:13px;font-weight:900;text-align:center;flex-shrink:0;letter-spacing:0}
  .tt-row .bar{width:3px;border-radius:2px;flex-shrink:0;align-self:stretch;min-height:30px}
  .tt-row .ttl{font-size:14px;font-weight:700;display:flex;align-items:center;gap:5px;min-width:0}
  .tt-row .ttl .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tt-row .ttl .pill{margin-left:0;flex-shrink:0}
  .tt-row .meta{font-size:11px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tt-row .go{font-size:13px;color:var(--muted);flex-shrink:0}
  /* 件数が多い日は、この枠の中だけでスクロールする */
  .tt-list{max-height:310px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-right:4px}
  .tt-add{position:fixed;right:18px;bottom:78px;width:52px;height:52px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:28px;line-height:52px;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.22);z-index:40;cursor:pointer}
  .tt-add.off{opacity:.35;pointer-events:none}
  /* ===== バッジ／リスト ===== */
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;border:1.2px solid var(--ink);letter-spacing:.04em}
  /* 名札が2つ以上並ぶときは、くっつかないように離す */
  .pill+.pill{margin-left:6px}
  .pill.fill{background:var(--ink);color:var(--paper)}
  .row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line);gap:10px}
  .row:not(.btn):last-child{border-bottom:none}
  .row .meta{font-size:12px;color:var(--muted)}
  .row .ttl{font-weight:700}
  .row.tap{cursor:pointer}
  .row.tap:active{background:var(--smoke)}
  .empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:13px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  /* 予約画面の部位ボタン。下の入力欄とくっつかないよう離し、押しやすくする */
  #bodyChips{gap:8px;margin-top:8px;margin-bottom:12px}
  #bodyChips .chip{font-size:13px;padding:7px 14px}
  /* 予約の人数ボタン */
  .party{display:flex;gap:8px;margin-top:6px}
  .party button{flex:1;padding:11px 0;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font-size:15px;font-weight:700}
  .party button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .party button:disabled{opacity:.35}
  .chip{font-size:11px;border:1.2px solid var(--line);border-radius:20px;padding:3px 10px;cursor:pointer;background:var(--paper);color:var(--ink);font-weight:600}
  .chip.sel{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  /* その日は予約を受け付けていない担当 */
  .chip.off{opacity:.4;cursor:default;text-decoration:line-through}
  .tdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle;flex-shrink:0}
  /* ===== モーダル ===== */
  .ov{position:fixed;inset:0;background:rgba(10,10,10,.55);display:none;align-items:flex-end;justify-content:center;z-index:100;padding:0}
  .ov.show{display:flex}
  .sheet.full{max-height:100%;height:100%;border-radius:0;border-top:none;padding-top:calc(18px + env(safe-area-inset-top, 0px))}
  .sheet{overscroll-behavior:contain;background:var(--paper);width:100%;max-width:760px;border-radius:20px 20px 0 0;border-top:2px solid var(--ink);padding:22px 18px calc(22px + env(safe-area-inset-bottom));max-height:90vh;overflow-y:auto;animation:up .22s ease;position:relative}
  @keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:translateY(0);opacity:1}}
  .sheet h3{font-size:18px;font-weight:900;margin-bottom:4px}
  /* スクロールしても、見出しと×は上に残す。帯は画面の一番上まで届かせる */
  #ov .sheet{padding-top:0}
  #ov .sheet.full{padding-top:calc(18px + env(safe-area-inset-top, 0px) + var(--demobar, 0px))}
  #ask .sheet{padding-top:22px}
  #ovBody>h3:first-child{position:sticky;top:0;z-index:5;background:var(--paper);
    margin:0 -18px 4px;padding:20px 52px 10px 18px;border-radius:18px 18px 0 0}
  .sheet .sub{font-size:13px;color:var(--muted);margin-bottom:16px}
  /* 確認ダイアログ。端末の confirm() はアプリ内ブラウザなどで出ないことがあるため、自前で出す */
  #ask{z-index:350}
  #ask .sheet{max-width:480px}
  #askMsg{font-size:14px;line-height:1.7;white-space:pre-line;margin:6px 0 18px}
  .close{position:sticky;float:right;top:12px;margin:0 -2px -34px 0;font-size:22px;background:none;color:var(--muted);z-index:6;
    width:32px;height:32px;line-height:1}
  /* ===== ヒアリングシート ウィザード ===== */
  #wiz{position:fixed;inset:0;background:var(--paper);z-index:300;display:none;flex-direction:column}
  #wiz.show{display:flex}
  .wiz-top{padding:14px 18px;display:flex;align-items:center;gap:12px;border-bottom:1.5px solid var(--line)}
  .wiz-step{font-size:12px;font-weight:900;letter-spacing:.05em;white-space:nowrap}
  .wiz-prog{flex:1;height:6px;background:var(--smoke);border-radius:6px;overflow:hidden}
  .wiz-prog i{display:block;height:100%;background:var(--ink);transition:width .35s ease}
  .wiz-skip{font-size:12px;color:var(--muted);background:none;text-decoration:underline;white-space:nowrap}
  .wiz-body{flex:1;overflow-y:auto;padding:30px 22px;max-width:560px;margin:0 auto;width:100%;animation:wizin .28s ease}
  @keyframes wizin{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
  .wiz-body h3{font-family:var(--serif);font-size:24px;font-weight:600;letter-spacing:.04em;margin-bottom:6px}
  .wiz-body .lead{font-size:13px;color:var(--muted);margin-bottom:22px}
  .wiz-foot{padding:14px 18px calc(14px + env(safe-area-inset-bottom));border-top:1.5px solid var(--line);display:flex;gap:10px;max-width:560px;margin:0 auto;width:100%}
  .bigchips{display:flex;flex-wrap:wrap;gap:9px;margin:4px 0 8px}
  .bigchips .chip{font-size:14px;padding:11px 17px;border-radius:12px;border-width:1.5px}
  .wiz-done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px;text-align:center}
  .wiz-done .arm{animation:pump 1.1s ease infinite alternate;font-size:64px}
  @keyframes pump{from{transform:scale(1) rotate(-4deg)}to{transform:scale(1.18) rotate(4deg)}}
  .wiz-done h3{font-family:var(--serif);font-size:26px;font-weight:600;letter-spacing:.05em}
  .wiz-done p{font-size:13px;color:var(--muted)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  /* ===== ヒアリングシート閲覧 ===== */
  .kv{display:flex;border-bottom:1px solid var(--line);padding:9px 0;gap:12px;font-size:13.5px}
  /* いま保存されている合言葉 */
  .staff-now{border:1.5px solid var(--line);border-radius:11px;padding:12px 14px;background:var(--smoke)}
  .staff-now .k{font-size:11px;color:var(--muted);letter-spacing:.08em;margin-bottom:3px}
  .staff-now .now{font-size:16px;font-weight:900;letter-spacing:.06em}
  .staff-now .now .dim{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:0}
  .staff-now .now.dim{font-size:13px;font-weight:700;color:var(--muted)}
  .staff-now.dirty{border-color:var(--danger)}
  .staff-now.dirty::after{content:"入力を変更しました。保存すると切り替わります";display:block;margin-top:6px;font-size:11px;font-weight:700;color:var(--danger)}
  .kv:last-child{border:none}
  .kv .k{flex:0 0 96px;color:var(--muted);font-weight:700;font-size:12px;padding-top:1px}
  .kv .v{flex:1;white-space:pre-wrap}
  .kv .v.dim{color:#c4c4c8}
  /* ===== ログイン ===== */
  .auth-wrap{max-width:380px;margin:5vh auto 0;padding:0 22px 40px}
  .auth-logo{text-align:center;margin-bottom:26px}
  .auth-logo .big{font-family:var(--serif);font-size:32px;font-weight:600;letter-spacing:.1em;margin-top:8px}
  .auth-logo .tag{font-size:10px;letter-spacing:.4em;color:var(--muted);margin-top:4px}
  .switch{text-align:center;font-size:13px;color:var(--muted);margin-top:16px}
  .switch a{color:var(--ink);font-weight:700;text-decoration:underline;cursor:pointer}
  .msg{font-size:13px;padding:10px 12px;border-radius:9px;margin-top:12px;display:none}
  .msg.show{display:block}
  .msg.err{background:#fef2f2;color:var(--danger);border:1px solid #fecaca}
  .msg.ok{background:#f0fdf4;color:var(--ok);border:1px solid #bbf7d0}
  .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:30px;font-size:13px;font-weight:700;z-index:400;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
  .hide{display:none!important}
  .seg{display:flex;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden;margin-bottom:14px}
  .seg button{flex:1;background:var(--paper);color:var(--ink);padding:9px;font-size:13px}
  .seg button.on{background:var(--ink);color:var(--paper)}
  /* ログイン画面の選択カード */
  .auth-box{border:1.5px solid var(--line);border-radius:14px;padding:18px 16px;margin-bottom:14px;background:var(--paper)}
  .auth-box-ttl{font-size:16px;font-weight:900;letter-spacing:.04em;margin-bottom:4px}
  .small{font-size:12px;color:var(--muted)}
  .loader{text-align:center;padding:40px;color:var(--muted);font-size:13px}
</style>
</head>
<body>

<!-- スプラッシュ -->
<div id="splash"></div>

<!-- ===================== ログイン ===================== -->
<div id="busyBar" aria-hidden="true"></div>
<div id="authView">
  <div class="auth-wrap">
    <div class="auth-logo" id="authLogo"></div>

    <!-- 1画面目：やりたいことを選ぶ -->
    <div id="authHome">
      <div class="auth-box">
        <div class="auth-box-ttl" style="margin-bottom:12px">はじめての方（ゲストで申込）</div>
        <button class="btn" onclick="startGuest()">カウンセリング＋体験を申し込む</button>
      </div>
      <div class="auth-box">
        <div class="auth-box-ttl">すでに通われている方</div>
        <div class="small" style="margin-bottom:12px">スタジオをご利用中で、アプリのご登録がまだの方。</div>
        <button class="btn ghost" onclick="startExist()">アプリに登録する</button>
      </div>
      <div class="auth-box">
        <div class="auth-box-ttl">会員の方</div>
        <div class="small" style="margin-bottom:12px">ご登録済みのメールアドレスでお入りください。</div>
        <button class="btn ghost" onclick="setAuthMode('login')">ログイン</button>
        <div style="height:10px"></div>
        <button class="btn ghost" onclick="setAuthMode('signup')">新規会員登録</button>
      </div>
      <div id="staffLinkWrap" style="text-align:center;margin-top:20px">
        <a onclick="openStaffSignup()" style="font-size:11px;color:var(--muted);text-decoration:underline;cursor:pointer">スタッフの方の登録</a>
      </div>
    </div>

    <!-- 2画面目：ログイン / 会員登録 -->
    <div id="authForm" class="hide">
      <div class="auth-box-ttl" id="authTitle" style="margin-bottom:14px">ログイン</div>
      <!-- 店舗は登録のときだけ選ぶ。あとで変えるのはトレーナーの画面から -->
      <div id="auStoreFld" class="hide">
        <label class="fld">ご利用の店舗</label>
        <div class="chips" id="auStore"></div>
      </div>
      <div id="nameFld" class="hide">
        <label class="fld">お名前</label>
        <input id="auName" placeholder="山田 花子" autocomplete="name">
      </div>
      <label class="fld">メールアドレス</label>
      <input id="auEmail" type="email" placeholder="you@example.com" autocomplete="email">
      <label class="fld">パスワード</label>
      <input id="auPass" type="password" placeholder="6文字以上" autocomplete="current-password">
      <div id="forgotFld" class="forgot"><a onclick="setAuthMode('reset')">パスワードをお忘れの方</a></div>
      <div id="staffFld" class="hide" style="margin-top:12px">
        <div id="staffBox" class="hide">
          <label class="fld">スタッフの合言葉</label>
          <input id="auStaff" placeholder="お店から聞いた合言葉" autocomplete="off">
          <div class="small" style="margin-top:4px">トレーナーとして登録されます。お客様は入力しないでください。</div>
        </div>
      </div>
      <div id="agreeFld" class="hide" style="margin-top:16px">
        <div onclick="openTerms()" style="border:1.5px solid var(--ink);border-radius:9px;padding:11px 13px;cursor:pointer;display:flex;align-items:center;justify-content:space-between">
          <span id="termsOpenLabel" style="font-size:13px;font-weight:700"></span>
          <span style="font-size:12px;color:var(--muted)">タップで開く ▸</span>
        </div>
        <label id="agreeRow" class="agree-row locked" onclick="return agreeClick(event)">
          <input type="checkbox" id="auAgree" style="width:20px;height:20px;flex-shrink:0;margin-top:1px;accent-color:#0a0a0a;cursor:pointer">
          <span id="termsAgreeLabel"></span>
        </label>
        <div id="agreeNote" class="small" style="margin-top:4px"></div>
      </div>
      <div style="height:18px"></div>
      <button class="btn" id="authBtn" onclick="doAuth()">ログイン</button>
      <div id="authMsg" class="msg"></div>
      <button class="btn ghost" style="margin-top:12px" onclick="setAuthMode('home')">← 戻る</button>
    </div>

    <!-- はじめての方：カウンセリング＋体験の申し込み -->
    <div id="authGuest" class="hide"></div>
    <!-- すでに通われている方の登録（startExist が中身を描く） -->
    <div id="authExist" class="hide"></div>

    <!-- パスワードを忘れたとき -->
    <div id="authReset" class="hide">
      <div class="auth-box-ttl" style="margin-bottom:10px">パスワードの再設定</div>
      <div class="small" style="margin-bottom:4px;line-height:1.7">ご登録のメールアドレスを入力してください。<br>パスワードを決め直すためのメールをお送りします。</div>
      <label class="fld">メールアドレス</label>
      <input id="rsEmail" type="email" placeholder="you@example.com" autocomplete="email">
      <div style="height:18px"></div>
      <button class="btn" id="rsBtn" onclick="sendReset()">メールを送る</button>
      <div id="rsMsg" class="msg"></div>
      <button class="btn ghost" style="margin-top:12px" onclick="setAuthMode('login')">← ログインに戻る</button>
    </div>
  </div>
</div>

<!-- ===================== アプリ本体 ===================== -->
<div id="appView" class="hide">
  <header class="brand">
    <div class="logo" id="hdrLogo"></div>
    <div class="who"><b id="whoName">—</b><span onclick="logout()" style="cursor:pointer;text-decoration:underline">ログアウト</span></div>
  </header>
  <main id="screen"><div class="loader">読み込み中…</div></main>
  <nav class="tabs" id="tabs"></nav>
</div>

<!-- 予約シート等のモーダル -->
<div class="ov" id="ov">
  <div class="sheet">
    <button class="close" onclick="closeOv()">×</button>
    <div id="ovBody"></div>
  </div>
</div>

<!-- 確認ダイアログ -->
<div class="ov" id="ask">
  <div class="sheet">
    <div id="askMsg"></div>
    <button class="btn" id="askOk">OK</button>
    <button class="btn ghost" style="margin-top:8px" id="askNo">やめる</button>
  </div>
</div>

<!-- ヒアリングシート ウィザード -->
<div id="wiz">
  <div class="wiz-top">
    <span class="wiz-step" id="wizStep">1/6</span>
    <div class="wiz-prog"><i id="wizProg" style="width:16%"></i></div>
    <button class="wiz-skip" onclick="wizSkip()">あとで入力</button>
  </div>
  <div class="wiz-body" id="wizBody"></div>
  <div class="wiz-foot" id="wizFoot"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* 店舗設定（SHOP / FIREBASE_CONFIG）は config.js で定義しています */
if(typeof SHOP==='undefined'){ document.write('<p style="padding:24px;font-family:sans-serif">config.js が読み込めていません。ファイルが同じ場所にあるか確認してください。</p>'); }
/* 管理者について：最初に登録したアカウントが自動でトレーナー（管理者）になります。
   その人がオーナーになり、スタッフの合言葉とトレーナーの追加・解除はオーナーだけが行えます。 */

/* デモモード
   ・SHOP.demo = true を config.js に書くと常にデモ
   ・Firebase 未設定のときも自動でデモになります（黄色いバーが出ます）
   ・URL の末尾に ?demo を付けると、その画面だけデモで動く（本番のデータには触らない） */
const DEMO = (SHOP.demo === true)
  || new URLSearchParams(location.search).has("demo")
  || !FIREBASE_CONFIG.apiKey
  || FIREBASE_CONFIG.apiKey.indexOf("ここに") === 0;

/* 体験申し込みの直リンク（LINE などに貼る用）
   URL の末尾に ?taiken を付けて開くと、いきなり「カウンセリング＋体験のお申し込み」から始まる。
   会員としてログイン済みの方は、今までどおりご自分の画面が開く。 */
const GUEST_LINK = (function(){
  const q = new URLSearchParams(location.search);
  return q.has("taiken") || q.has("trial") || q.has("guest");
})();

/* ====== 営業時間枠（管理画面から変更可） ====== */
/* 営業日（平日のみ／毎日）は店舗設定で決まり、画面からは変えられない。first は毎日 */
const SHOP_WEEKDAYS_ONLY = !!((SHOP.defaultSettings||{}).weekdaysOnly);
let SETTINGS = Object.assign({ openHour:10, closeHour:21, weekdaysOnly:true, maxParty:3 }, SHOP.defaultSettings || {});
/* 会員同士のグループ（相乗り参加）を使う店舗だけ true。config.js の groups で切り替える */
const USE_GROUPS = SHOP.groups === true;
/* 1回の予約で人数を選べるようにするか。false なら常に1名。config.js の party で切り替える */
const USE_PARTY = SHOP.party !== false;

let sb=null, me=null, profile=null, authMode='home', curTab='reserve', selDate=null;

/* ============ 利用契約書 全文 ============ */
const TERMS_TEXT  = SHOP.terms;
const TERMS_TITLE = SHOP.termsTitle || "利用規約";

/* マイページで読み込んだヒアリングシート。契約書の差し込みに使う */
let mySheet = null;

/* 契約書の {{ }} を会員の情報に置き換える。未入力の項目は下線のまま */
function fillTerms(text){
  const blank = "＿＿＿＿＿＿＿＿＿＿";
  const nameEl = document.getElementById("auName");
  const name = (profile && profile.name) || (nameEl ? nameEl.value.trim() : "");
  const at = (profile && profile.terms_agreed_at) ? new Date(profile.terms_agreed_at) : new Date();
  const day = at.toLocaleDateString("ja-JP-u-ca-japanese",{era:"long",year:"numeric",month:"long",day:"numeric"});
  return String(text).replace(/\{\{(.+?)\}\}/g, function(_, k){
    k = k.trim();
    if(k === "同意日") return day;
    if(k === "氏名")   return name ? esc(name) : blank;
    if(k.indexOf("intake:") === 0){
      const v = mySheet ? String(mySheet[k.slice(7).trim()] || "").trim() : "";
      return v ? esc(v) : blank;
    }
    return "";
  });
}

/* readOnly=true で「同意して閉じる」を出さずに閲覧だけさせる */
function openTerms(readOnly){
  document.getElementById('ovBody').innerHTML=`
    <h3>${TERMS_TITLE}</h3>
    <div class="sub">${readOnly?'いつでもここから確認できます':'最後までお読みいただくと、同意ボタンが押せるようになります'}</div>

/* 利用契約書を最後まで読んだか。読むまで同意のチェックは入れられない */
let termsRead=false;
function setTermsRead(v){
  termsRead=v;
  const row=document.getElementById('agreeRow');
  if(row) row.classList.toggle('locked',!v);
  const note=document.getElementById('agreeNote');
  if(note) note.classList.toggle('hide',v);

/* 端末が通知を使えるかどうか。
   none = 非対応 / home = iPhoneでホーム画面に追加が必要 / ok = 使える */
function pushSupport(){
  if(!("serviceWorker" in navigator) || !("Notification" in window) || !("PushManager" in window)) return "none";
  const ios = /iP(hone|ad|od)/.test(navigator.userAgent)
    || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  if(ios && !standalone) return "home";
  return "ok";
}
let swReg = null;
async function registerSW(){
  if(swReg) return swReg;
  if(!("serviceWorker" in navigator)) return null;
  try { swReg = await navigator.serviceWorker.register("sw.js"); return swReg; }
  catch(e){ return null; }
}
/* Firebase(FCM)をつないだあと、ここで端末のトークンを保存する。
   保存先は push_tokens。現状は何もしない。 */
async function savePushToken(reg){ return; }
async function enablePush(){
  const reg = await registerSW();
  if(!reg){ toast("通知を準備できませんでした"); return; }
  let perm = Notification.permission;
  if(perm === "default") perm = await Notification.requestPermission();
  if(perm !== "granted"){ toast("通知が許可されませんでした"); render(); return; }
  await savePushToken(reg);
  toast("通知をオンにしました");
  render();
}
async function testPush(){
  const reg = await registerSW();
  if(!reg || Notification.permission !== "granted"){ toast("先に通知をオンにしてください"); return; }
  reg.showNotification(SHOP.name, {
    body: "通知のテストです。これが表示されれば設定は完了です。",
    icon: "icons/icon-192.png", badge: "icons/icon-192.png", tag: "test"
  });
}
/* マイページに出す通知カード */
function pushCard(){
  if(SHOP.push === false) return "";
  const sup = pushSupport();
  let body;
  if(sup === "none"){
    body = `<div class="small">このブラウザは通知に対応していません。</div>`;
  }else if(sup === "home"){
    body = `<div class="small">iPhoneでは、ホーム画面に追加してから通知をオンにできます。<br>
      共有ボタン → ホーム画面に追加 → 追加したアイコンから開いてください。</div>`;
  }else if(Notification.permission === "granted"){
    body = `<div class="small" style="margin-bottom:8px">オンになっています。</div>
      <button class="btn sm ghost" onclick="testPush()">テスト通知を送る</button>`;
  }else if(Notification.permission === "denied"){
    body = `<div class="small">通知がブロックされています。<br>

}

function makeMockSb(){
  function hydrate(table,row){
    const r={...row};
    if(table==='reservations'){
      r.profiles=DB.profiles.find(p=>p.id===r.user_id)||null;
      r.reservation_participants=DB.reservation_participants
        .filter(p=>p.reservation_id===r.id)
        .map(p=>({...p,profiles:DB.profiles.find(x=>x.id===p.user_id)}));
    }
    if(table==='reservation_participants'){
      r.profiles=DB.profiles.find(p=>p.id===r.user_id)||null;
      r.reservations=DB.reservations.find(x=>x.id===r.reservation_id)||null;
      if(r.reservations){r.reservations={...r.reservations,profiles:DB.profiles.find(p=>p.id===r.reservations.user_id)};}
    }
    if(table==='group_members'){
      r.groups=DB.groups.find(g=>g.id===r.group_id)||null;
      r.profiles=DB.profiles.find(p=>p.id===r.user_id)||null;
    }
    return r;
  }
  function query(table){
    const filters=[];
    const api={
      _limit:null,
      select(){return api;},
      eq(col,val){filters.push(r=>r[col]===val);return api;},
      gte(col,val){filters.push(r=>r[col]>=val);return api;},
      lte(col,val){filters.push(r=>r[col]<=val);return api;},
      /* 並べ替えは本番（Firebase）と同じ決まりで行う */
      _orders:[],
      order(col,opt){api._orders.push([col,!(opt&&opt.ascending===false)]);return api;},
      limit(n){api._limit=n;return api;},
      _run(){
        let rows=(DB[table]||[]).filter(r=>filters.every(f=>f(r)));
        [...api._orders].reverse().forEach(([c,asc])=>{
          rows=[...rows].sort((a,b)=>{const x=a[c],y=b[c];if(x===y)return 0;return (x<y?-1:1)*(asc?1:-1);});
        });
        let out=rows.map(r=>hydrate(table,r));
        if(api._limit)out=out.slice(0,api._limit);
        return out;
      },
      single(){return Promise.resolve({data:api._run()[0]||null,error:null});},
      maybeSingle(){return api.single();},
      then(res){res({data:api._run(),error:null});},
      insert(payload){
        const arr=Array.isArray(payload)?payload:[payload];
        /* 本番（Firebase）と同じく、作成日時を付ける */
        const created=arr.map(p=>{const row={id:newId(),created_at:new Date().toISOString(),...p};(DB[table]=DB[table]||[]).push(row);return row;});
        saveDB();
        return {data:created,error:null,select:()=>({single:()=>Promise.resolve({data:created[0],error:null})}),then:(res)=>res({data:created,error:null})};
      },
      update(patch){
        return {eq:(col,val)=>{(DB[table]||[]).forEach(r=>{if(r[col]===val)Object.assign(r,patch);});saveDB();return Promise.resolve({data:null,error:null});}};
      },
      upsert(payload){
        const arr=Array.isArray(payload)?payload:[payload];
        arr.forEach(p=>{
          const key=('id' in p)?'id':('user_id' in p)?'user_id':null;
          const ex=key?(DB[table]||[]).find(r=>r[key]===p[key]):null;
          if(ex)Object.assign(ex,p);else (DB[table]=DB[table]||[]).push(p);
        });
        saveDB();
        return {data:arr,error:null,then:(res)=>res({data:arr,error:null})};
      },
      delete(){
        return {eq:(col,val)=>{
          const second={
            eq:(c2,v2)=>{DB[table]=DB[table].filter(r=>!(r[col]===val&&r[c2]===v2));saveDB();return Promise.resolve({error:null});},
            then:(res)=>{DB[table]=DB[table].filter(r=>r[col]!==val);saveDB();res({error:null});}
          };
          return second;
        }};
      },
    };
    return api;
  }
  return {
    from:(t)=>query(t),
    auth:{
      getUser:async()=>({data:{user:me}}),
      /* デモの新規登録。メールとパスワードは DB.demo_accounts に覚える（この端末のデモ専用） */
      async signUp({email,password}){
        const acc=(DB.demo_accounts=DB.demo_accounts||[]);
        if(acc.some(a=>a.email===email)) return {data:null,error:{message:'email-already-in-use'}};
        if(!password||password.length<6) return {data:null,error:{message:'weak-password'}};
        const id='new'+Date.now().toString(36);
        acc.push({id,email,password}); saveDB();
        me={id,email};
        return {data:{user:me},error:null};
      },
      /* ゲスト申し込み用。メールもパスワードも無いまま使い始める */
      async signInAnonymously(){
        const id='guest'+Date.now().toString(36);
        (DB.demo_accounts=DB.demo_accounts||[]).push({id,email:'',password:'',guest:true}); saveDB();
        me={id,email:''};
        return {data:{user:me},error:null};
      },
      /* ゲストのまま使っている方が、次回からログインできるようにする（デモ）。
         id はそのままなので、予約もチケットも引き継がれる */
      async linkEmailPassword({email,password}){
        const acc=(DB.demo_accounts=DB.demo_accounts||[]);
        if(acc.some(a=>a.email===email)) return {data:null,error:{message:'email-already-in-use'}};
        if(!password||password.length<6) return {data:null,error:{message:'weak-password'}};
        const a=acc.find(x=>x.id===me.id);
        if(a){ a.email=email; a.password=password; a.guest=false; }
        else acc.push({id:me.id,email,password});
        saveDB();
        me={...me,email};
        return {data:{},error:null};
      },
      async signInWithPassword({email,password}){
        const a=(DB.demo_accounts||[]).find(x=>x.email===email&&x.password===password);
        if(!a) return {data:null,error:{message:'invalid-credential'}};
        me={id:a.id,email:a.email};
        return {data:{user:me},error:null};
      },
      /* デモではメールは送らない。形式だけ確かめる */
      async resetPasswordForEmail(email){
        if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return {data:null,error:{message:'invalid-email'}};
        return {data:{},error:null};
      },
      /* ログアウト後はログイン画面から始める */
      async signOut(){ try{ localStorage.setItem(DEMO_USER_KEY,''); }catch(e){} return {}; },
      updateUser:async()=>({data:null,error:{message:'デモではパスワードは変更できません'}}) },
    /* デモでは順番に行うだけ（本番と同じ呼び出し方にそろえる） */
    batch(){
      const ops=[];
      return {
        update(table,id,patch){ ops.push(['update',table,String(id),patch]); return this; },
        delete(table,id){ ops.push(['delete',table,String(id)]); return this; },
        async commit(){
          ops.forEach(([kind,table,id,patch])=>{
            const arr=DB[table]||[];
            const i=arr.findIndex(x=>String(x.id)===id);
            if(i<0) return;
            if(kind==='update') Object.assign(arr[i],patch); else arr.splice(i,1);
          });
          saveDB();
          return {error:null};
        },
      };
    },
    /* デモの写真は、その場かぎり（ブラウザを閉じると消える）。保存の容量を使わないため */
    storage:{ from:()=>({
      list:async(prefix)=>({data:Object.keys(DEMO_PHOTOS).filter(k=>k.startsWith(prefix+'/')).map(k=>({name:k.slice(prefix.length+1)})),error:null}),
      upload:async(path,blob)=>{
        try{
          DEMO_PHOTOS[path]=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>rej(fr.error);fr.readAsDataURL(blob);});
          return {data:{path},error:null};
        }catch(e){ return {data:null,error:{message:'保存できませんでした'}}; }
      },
      remove:async(paths)=>{ (paths||[]).forEach(p=>{delete DEMO_PHOTOS[p];}); return {data:null,error:null}; },
      createSignedUrl:async(path)=>({data:DEMO_PHOTOS[path]?{signedUrl:DEMO_PHOTOS[path]}:null,error:null}),
    }) },
  };
}

/* ============================================================
   Firebase アダプタ
   Supabase 互換の sb API（このアプリで使う範囲のみ）を
   Firebase Auth / Firestore / Storage で実装する。
   コレクション名は旧テーブル名と同じ。ドキュメントIDは
   profiles=uid, settings=固定"1", intake_sheets=user_id, 他は自動ID。
   行データには常に id フィールドを付けて返す。
   ============================================================ */
/* 通信中の数。0 より多い状態が少し続いたら、画面の上に線を出す */
let busyN=0, busyTimer=null;
function busy(d){
  busyN=Math.max(0,busyN+d);
  const el=document.getElementById('busyBar');
  if(!el) return;
  clearTimeout(busyTimer);
  if(busyN>0) busyTimer=setTimeout(()=>el.classList.add('on'),150);
  else el.classList.remove('on');
}
function track(pr){ busy(1); return Promise.resolve(pr).finally(()=>busy(-1)); }
/* Firestore の読み書きをすべて track に通す（中身はそのまま） */
function trackDb(obj){
  return new Proxy(obj,{get(t,k){
    const v=t[k];
    if(typeof v!=='function') return v;
    return (...a)=>{
      const r=v.apply(t,a);
      if(r && typeof r.then==='function') return track(r);
      if(r && typeof r==='object' && (typeof r.get==='function'||typeof r.where==='function')) return trackDb(r);
      return r;
    };
  }});
}
/* ボタンを「処理中…」にする。戻すときは busyBtn(el,false) */
function busyBtn(el,on,label){
  if(!el) return;
  if(on){ if(!el.dataset.label) el.dataset.label=el.textContent; el.textContent=label||'処理中…'; el.disabled=true; el.classList.add('is-busy'); }
  else{ if(el.dataset.label){ el.textContent=el.dataset.label; delete el.dataset.label; } el.disabled=false; el.classList.remove('is-busy'); }
}
function makeFirebaseSb(){
  const auth=firebase.auth();
  const db=trackDb(firebase.firestore());
  /* 写真の保存先。"firestore"（無料プランで使える。既定）か "storage"（Blaze プランが必要） */
  const PHOTO_IN_FIRESTORE=SHOP.photoStore!=='storage';
  let _fst=null;
  const fstRef=p=>{ if(!_fst) _fst=firebase.storage(); return _fst.ref(p); };
  /* Firestore に保存した写真。ドキュメントIDは「会員ID__ファイル名」。読み込んだ写真は覚えておく */
  const photoCache={};
  /* 会員ごとの写真一覧の覚え書き。
     写真は本体（画像そのもの）ごと読み込むので、カルテを開くたびに読み直すと重い。
     同じ会員をもう一度開いたときは、少しの間この控えを使う。
     追加・削除したときは、その会員ぶんだけ捨てる */
  const photoList={};
  const PHOTO_LIST_TTL=60000;
  const photoListBust=uid=>{ delete photoList[String(uid)]; };
  const photoId=path=>String(path).replace('/','__');
  const blobToDataUrl=b=>new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>rej(fr.error);fr.readAsDataURL(b);});

  const rowOf=(doc)=>doc.exists?{id:doc.id,...doc.data()}:null;
  const docData=async(table,id)=>{
    if(id===undefined||id===null)return null;
    return rowOf(await db.collection(table).doc(String(id)).get());
  };
  /* 予約一覧などに名前を付けるときだけ使う、短い間の覚え書き。書き込みがあれば捨てる */
  const joinCache=new Map();
  /* 会員・トレーナーの名前は、めったに変わらない。
     長めに覚えておくと、予約一覧に名前を付けるときの読み込みが減る。
     この端末で書き換えたときは bust() で捨てるので、古い名前は残らない */
  const JOIN_TTL=120000;
  const joinDoc=(table,id)=>{
    if(id===undefined||id===null) return Promise.resolve(null);
    const k=table+'/'+id, hit=joinCache.get(k);
    if(hit && Date.now()-hit.at<JOIN_TTL) return hit.p.then(r=>r?{...r}:r);
    const pr=docData(table,id);
    joinCache.set(k,{at:Date.now(),p:pr});
    pr.catch(()=>joinCache.delete(k));
    return pr.then(r=>r?{...r}:r);
  };
  const bust=table=>{ for(const k of [...joinCache.keys()]) if(k.startsWith(table+'/')) joinCache.delete(k); };
  /* 会員の一覧を読んだら、1人ずつの覚え書きにも入れておく。
     こうすると、予約一覧の名前を付けるための読み込みが要らなくなる */
  const seedJoin=(table,rows)=>{
    if(table!=='profiles') return;
    const now=Date.now();
    (rows||[]).forEach(r=>{ if(r && r.id!=null) joinCache.set(table+'/'+r.id,{at:now,p:Promise.resolve({...r})}); });
  };
  /* 等しい条件はそのまま、範囲の条件（1つの項目だけのとき）もデータベース側で絞る */
  const whereGet=async(table,pairs,ranges)=>{
    let q=db.collection(table);
    pairs.forEach(([c,v])=>{q=q.where(c,'==',v);});
    (ranges||[]).forEach(([c,op,v])=>{q=q.where(c,op,v);});
    return (await q.get()).docs.map(rowOf);
  };

  /* デモ用モックの hydrate と同じ関連付けを Firestore で行う */
  async function hydrate(table,r,sel){
    if(!r)return r;
    const want=(name)=>sel&&sel.includes(name+'(');
    if(table==='reservations'){
      await Promise.all([
        want('profiles') && joinDoc('profiles',r.user_id).then(x=>{r.profiles=x;}),
        want('reservation_participants') && whereGet('reservation_participants',[['reservation_id',r.id]])
          .then(parts=>Promise.all(parts.map(async p=>({...p,profiles:await joinDoc('profiles',p.user_id)}))))
          .then(x=>{r.reservation_participants=x;}),
      ]);
    }
    if(table==='reservation_participants'){
      await Promise.all([
        want('profiles') && joinDoc('profiles',r.user_id).then(x=>{r.profiles=x;}),
        want('reservations') && docData('reservations',r.reservation_id).then(async x=>{
          r.reservations=x?{...x,profiles:await joinDoc('profiles',x.user_id)}:x;
        }),
      ]);
    }
    if(table==='group_members'){
      await Promise.all([
        want('groups') && docData('groups',r.group_id).then(x=>{r.groups=x;}),
        want('profiles') && joinDoc('profiles',r.user_id).then(x=>{r.profiles=x;}),
      ]);
    }
    return r;
  }

  const stripId=(p)=>{const {id,...rest}=p;return rest;};
  const withCreatedAt=(p)=>('created_at' in p)?p:{...p,created_at:new Date().toISOString()};

  function query(table){
    const eqs=[];       /* Firestore where に渡す等価条件 */
    let idEq=null;      /* id 指定はドキュメント取得に変換 */
    const post=[];      /* クライアント側で適用する条件 */
    const ranges=[];    /* 範囲の条件（データベース側でも絞れるときに使う） */
    const orders=[];
    let sel='*', lim=null;
    const api={
      select(s){sel=s||'*';return api;},
      eq(col,val){if(col==='id')idEq=val;else eqs.push([col,val]);return api;},
      gte(col,val){post.push(r=>r[col]>=val);ranges.push([col,'>=',val]);return api;},
      lte(col,val){post.push(r=>r[col]<=val);ranges.push([col,'<=',val]);return api;},
      order(col,opt){orders.push([col,!(opt&&opt.ascending===false)]);return api;},
      limit(n){lim=n;return api;},
      async _run(){
        let rows;
        if(idEq!==null){
          const r=await docData(table,idEq);
          rows=r?[r]:[];
          rows=rows.filter(r=>eqs.every(([c,v])=>r[c]===v));
        }else{
          /* 等しい条件がなく、範囲が1つの項目だけなら、索引なしでデータベース側で絞れる */
          const oneField=ranges.length && !eqs.length && ranges.every(x=>x[0]===ranges[0][0]);
          rows=await whereGet(table,eqs,oneField?ranges:[]);
        }
        seedJoin(table,rows);
        rows=rows.filter(r=>post.every(f=>f(r)));
        orders.reverse().forEach(([c,asc])=>{
          rows.sort((a,b)=>{const x=a[c],y=b[c];if(x===y)return 0;return (x<y?-1:1)*(asc?1:-1);});
        });
        if(lim!==null)rows=rows.slice(0,lim);
        return Promise.all(rows.map(r=>hydrate(table,r,sel)));
      },
      async single(){const out=await api._run();return {data:out[0]||null,error:out[0]?null:{message:'not found'}};},
      async maybeSingle(){const out=await api._run();return {data:out[0]||null,error:null};},
      then(res,rej){api._run().then(out=>res({data:out,error:null})).catch(e=>res({data:null,error:e}));},
      insert(payload){
        bust(table);
        const run=async()=>{
          const arr=Array.isArray(payload)?payload:[payload];
          const created=[];
          for(const p of arr){
            const row=withCreatedAt(p);
            let ref;
            if('id' in row&&row.id!==null&&row.id!==undefined){ref=db.collection(table).doc(String(row.id));}
            else{ref=db.collection(table).doc();}
            await ref.set(stripId(row));
            created.push({...row,id:ref.id});
          }
          return created;
        };
        const pr=run();
        /* 保存に失敗したら、そこで処理を止める（成功したように見せない） */
        return {
          then(res,rej){pr.then(created=>res({data:created,error:null}),rej);},
          select:()=>({single:async()=>{
            const created=await pr;return {data:created[0]||null,error:null};
          }})
        };
      },
      update(patch){
        return {eq:async(col,val)=>{
          bust(table);
          if(col==='id'){await db.collection(table).doc(String(val)).update(patch);}
          else{
            const snap=await db.collection(table).where(col,'==',val).get();
            for(const d of snap.docs)await d.ref.update(patch);
          }
          return {data:null,error:null};
        }};
      },
      upsert(payload){
        bust(table);
        const run=async()=>{
          const arr=Array.isArray(payload)?payload:[payload];
          for(const p of arr){
            const key=('id' in p)?p.id:('user_id' in p)?p.user_id:null;
            const ref=key!==null?db.collection(table).doc(String(key)):db.collection(table).doc();
            await ref.set(stripId(withCreatedAt(p)),{merge:true});
          }
          return arr;
        };
        return {then(res,rej){run().then(a=>res({data:a,error:null}),rej);}};
      },
      delete(){
        bust(table);
        const delWhere=async(pairs)=>{
          const snap=await pairs.reduce((q,[c,v])=>q.where(c,'==',v),db.collection(table)).get();
          for(const d of snap.docs)await d.ref.delete();
        };
        return {eq:(col,val)=>{
          const second={
            eq:async(c2,v2)=>{
              if(col==='id'){ /* id + 条件の複合は未使用だが安全側に */
                const r=await docData(table,val);
                if(r&&r[c2]===v2)await db.collection(table).doc(String(val)).delete();
              }else{await delWhere([[col,val],[c2,v2]]);}
              return {error:null};
            },
            then(res,rej){
              (async()=>{
                if(col==='id')await db.collection(table).doc(String(val)).delete();
                else await delWhere([[col,val]]);
              })().then(()=>res({error:null}),rej);
            }
          };
          return second;
        }};
      },
    };
    return api;
  }

  const authUser=(u)=>u?{id:u.uid,email:u.email}:null;
  const waitAuth=()=>new Promise(res=>{const off=auth.onAuthStateChanged(u=>{off();res(u);});});

  return {
    from:(t)=>query(t),
    auth:{
      async getSession(){const u=await waitAuth();return {data:{session:u?{user:authUser(u)}:null},error:null};},
      async getUser(){const u=auth.currentUser||await waitAuth();return {data:{user:authUser(u)},error:null};},
      async signUp({email,password}){
        try{const cred=await auth.createUserWithEmailAndPassword(email,password);
          return {data:{user:authUser(cred.user)},error:null};}
        catch(e){return {data:null,error:{message:e.code||e.message}};}
      },
      /* ゲスト申し込み用。Firebase の「匿名ログイン」を使う（コンソールで有効にしておく） */
      async signInAnonymously(){
        try{const cred=await auth.signInAnonymously();
          return {data:{user:authUser(cred.user)},error:null};}
        catch(e){return {data:null,error:{message:e.code||e.message}};}
      },
      /* ゲスト（メールもパスワードも無い状態）のアカウントに、
         メールアドレスとパスワードを足す。uid は変わらないので、
         予約もチケットも写真もそのまま引き継がれる */
      async linkEmailPassword({email,password}){
        try{
          const cred=firebase.auth.EmailAuthProvider.credential(email,password);
          await auth.currentUser.linkWithCredential(cred);
          return {data:{},error:null};
        }catch(e){return {data:null,error:{message:e.code||e.message}};}
      },
      async signInWithPassword({email,password}){
        try{
          if(auth.currentUser&&auth.currentUser.email===email)return {data:{user:authUser(auth.currentUser)},error:null};
          const cred=await auth.signInWithEmailAndPassword(email,password);
          return {data:{user:authUser(cred.user)},error:null};}
        catch(e){return {data:null,error:{message:e.code||e.message}};}
      },
      /* パスワード再設定のメール（日本語で送る）。登録の無いメールでもエラーにしない */
      async resetPasswordForEmail(email){
        try{ auth.languageCode='ja'; await auth.sendPasswordResetEmail(email); return {data:{},error:null}; }
        catch(e){
          if(/user-not-found/.test(e.code||'')) return {data:{},error:null};
          return {data:null,error:{message:e.code||e.message}};
        }
      },
      async signOut(){await auth.signOut();return {error:null};},
      async updateUser({password}){
        try{await auth.currentUser.updatePassword(password);return {data:null,error:null};}
        catch(e){return {data:null,error:{message:translateErr(e.code||e.message)}};}
      },
    },
    /* いくつかの書き込みを「まとめて1回」で行う（途中だけ成功することがない）。
       予約の取消とチケットの返却のように、セットで行う必要があるものに使う */
    batch(){
      const ops=[];
      return {
        update(table,id,patch){ ops.push(['update',table,String(id),patch]); return this; },
        delete(table,id){ ops.push(['delete',table,String(id)]); return this; },
        async commit(){
          const b=firebase.firestore().batch();
          ops.forEach(([kind,table,id,patch])=>{
            const ref=firebase.firestore().collection(table).doc(id);
            if(kind==='update') b.update(ref,patch); else b.delete(ref);
          });
          ops.forEach(([,table])=>bust(table));
          try{ await track(b.commit()); return {error:null}; }
          catch(e){ return {error:{message:e.message||String(e)}}; }
        },
      };
    },
    storage:{
      from:(bucket)=>PHOTO_IN_FIRESTORE?({
        async list(prefix){
          const key=String(prefix), hit=photoList[key];
          if(hit && Date.now()-hit.at<PHOTO_LIST_TTL) return {data:hit.names.map(n=>({name:n})),error:null};
          try{
            const snap=await db.collection('member_photos').where('user_id','==',String(prefix)).get();
            const names=snap.docs.map(d=>{const x=d.data();photoCache[`${prefix}/${x.name}`]=x.data;return x.name;});
            photoList[key]={at:Date.now(),names};
            return {data:names.map(n=>({name:n})),error:null};
          }catch(e){return {data:[],error:e};}
        },
        async createSignedUrl(path){
          try{
            if(!photoCache[path]){
              const d=await db.collection('member_photos').doc(photoId(path)).get();
              if(!d.exists) return {data:null,error:{message:'not found'}};
              photoCache[path]=d.data().data;
            }
            return {data:{signedUrl:photoCache[path]},error:null};
          }catch(e){return {data:null,error:e};}
        },
        async upload(path,blob){
          try{
            const dataUrl=await blobToDataUrl(blob);
            /* Firestore の1件の上限（約1MB）に収まるか */
            if(dataUrl.length>950000) return {data:null,error:{message:'写真が大きすぎます。別の写真でお試しください'}};
            const [uid,name]=String(path).split('/');
            await db.collection('member_photos').doc(photoId(path)).set({user_id:uid,name,data:dataUrl,created_at:new Date().toISOString()});
            photoCache[path]=dataUrl;
            photoListBust(uid);
            return {data:{path},error:null};
          }catch(e){return {data:null,error:{message:e.code==='permission-denied'?'権限がありません（管理者のみ）':(e.message||'保存に失敗しました')}};}
        },
        async remove(paths){
          try{for(const p of paths){await db.collection('member_photos').doc(photoId(p)).delete();delete photoCache[p];photoListBust(String(p).split('/')[0]);}return {data:null,error:null};}
          catch(e){return {data:null,error:e};}
        },
      }):({
        async list(prefix){
          try{const res=await fstRef(`${bucket}/${prefix}`).listAll();
            return {data:res.items.map(i=>({name:i.name})),error:null};}
          catch(e){return {data:[],error:e};}
        },
        async createSignedUrl(path){
          try{const url=await fstRef(`${bucket}/${path}`).getDownloadURL();
            return {data:{signedUrl:url},error:null};}
          catch(e){return {data:null,error:e};}
        },
        async upload(path,blob,opt){
          try{await fstRef(`${bucket}/${path}`).put(blob,{contentType:(opt&&opt.contentType)||'application/octet-stream'});
            return {data:{path},error:null};}
          catch(e){return {data:null,error:{message:e.code==='storage/unauthorized'?'権限がありません（管理者のみ）':(e.message||'アップロードに失敗しました')}};}
        },
        async remove(paths){
          try{for(const p of paths)await fstRef(`${bucket}/${p}`).delete();return {data:null,error:null};}
          catch(e){return {data:null,error:e};}
        },
      }),
    },
  };
}

/* パスワード再設定のメールを送る */
async function sendReset(){

  const btn=document.getElementById('rsBtn');
  btn.disabled=true;
  try{
    const { error } = await sb.auth.resetPasswordForEmail(email);
    if(error) throw error;
    /* 登録があるかどうかは画面に出さない（他人のメールを調べられないように） */
    rsMsg((DEMO?'デモのため、実際にはメールは送られません。\n\n':'')+

  }catch(err){
    rsMsg(translateErr(err.message),'err');
  }finally{

  }

function existNext(){
  const msg=(t,k)=>{const e=document.getElementById('exMsg');e.textContent=t;e.className='msg '+(t?('show '+k):'');};
  const v=id=>document.getElementById(id).value.trim();
  const g={name:v('exName'), email:v('exEmail'),

  if(g.password.length<6){ msg('パスワードは6文字以上にしてください','err'); return; }
  exist=g;
  existStart(g);
}
async function existStart(g){
  const msg=(t,k)=>{const e=document.getElementById('exMsg');e.textContent=t;e.className='msg '+(t?('show '+k):'');};
  const { data, error } = await sb.auth.signUp({email:g.email, password:g.password});
  if(error||!data){
    msg(translateErr(String((error&&error.message)||''))||'ただいま受け付けできません。お手数ですがお電話ください','err');
    return;
  }
  const uid=data.user.id;
  /* ヒアリングは店頭で伺っているので、intake_done を立てて出さない。
     予約済みの扱い（booked_once）にして、最初からタブを出す */
  await sb.from('profiles').insert({
    id:uid, name:g.name, role:'member', tickets:0,
    store:g.store||DEFAULT_STORE, intake_done:true, booked_once:true,
    /* ヒアリングは店頭で伺っているので、アプリでは出さない */
    no_intake:true,
    /* すでに通われている方なので、初回体験は使い終わった扱いにする */
    trial_used:true,
    /* どこから登録された方か */
    joined_via:'exist'
  });
  /* お知らせメールの宛先として、メールアドレスだけ控えておく */
  await sb.from('intake_sheets').upsert({ user_id:uid, email:g.email });
  me={id:uid, email:g.email};
  try{ if(typeof DEMO_USER_KEY!=='undefined') localStorage.setItem(DEMO_USER_KEY, uid); }catch(e){}
  profile=(await sb.from('profiles').select('*').eq('id',uid).maybeSingle()).data;
  curStore=storeIdOf(profile);
  await loadSettings();
  await loadTrainers();
  document.getElementById('authView').classList.add('hide');
  document.getElementById('appView').classList.remove('hide');
  document.getElementById('whoName').textContent=profile.name;
  document.getElementById('roleTag').textContent='MEMBER';
  curTab='reserve'; selDate=null;
  closeOv();
  buildTabs(); render();
  toast('ご登録ありがとうございます');
}

/* ---------- 生年月日を選ぶ（年は選択、月は ‹ › で移動） ---------- */
let bdYM='';
function bdLabel(ds){ const [y,m,d]=ds.split('-').map(Number); return `${y}年${m}月${d}日`; }
function bdToggle(){
  const box=document.getElementById('gsBirthBox');
  box.classList.toggle('hide');
  if(box.classList.contains('hide')) return;
  const cur=document.getElementById('gsBirth').value;
  bdYM = cur ? cur.slice(0,7) : '1995-01';
  bdRender();
}
function bdMove(step){
  let [y,m]=bdYM.split('-').map(Number);
  m+=step;
  if(m<1){m=12;y--;} if(m>12){m=1;y++;}
  bdYM=`${y}-${String(m).padStart(2,'0')}`;
  bdRender();
}
function bdSetYear(v){ bdYM=`${v}-${bdYM.split('-')[1]}`; bdRender(); }
function bdPick(ds){
  document.getElementById('gsBirth').value=ds;
  document.getElementById('gsBirthBtn').textContent=bdLabel(ds);
  document.getElementById('gsBirthBox').classList.add('hide');
}
function bdRender(){
  const [y,m]=bdYM.split('-').map(Number);
  const sel=document.getElementById('gsBirth').value;
  const todayS=fmtDate(new Date()), thisYear=new Date().getFullYear();
  const first=new Date(y,m-1,1), last=new Date(y,m,0).getDate();
  let cells=DOW.map((w,i)=>`<div class="w ${dowClass(i)}">${w}</div>`).join('');
  for(let i=0;i<first.getDay();i++) cells+='<div></div>';
  for(let d=1;d<=last;d++){
    const ds=`${bdYM}-${String(d).padStart(2,'0')}`;
    const future=ds>todayS;
    cells+=`<button type="button" class="${ds===sel?'on':''} ${dowClass(new Date(y,m-1,d).getDay())}" ${future?'disabled':''} onclick="bdPick('${ds}')">${d}</button>`;
  }
  let years='';
  for(let yy=thisYear;yy>=1930;yy--) years+=`<option value="${yy}" ${yy===y?'selected':''}>${yy}年</option>`;
  document.getElementById('gsBirthBox').innerHTML=`
    <div class="mcal-head">
      <button type="button" onclick="bdMove(-1)" aria-label="前の月">‹</button>
      <div style="display:flex;align-items:center;gap:8px">
        <select onchange="bdSetYear(this.value)" style="width:auto;padding:8px 10px;font-weight:700">${years}</select>
        <b>${m}月</b>
      </div>
      <button type="button" onclick="bdMove(1)" aria-label="次の月">›</button>
    </div>

/* 電話番号にハイフンを入れる（入力中も整える）。
   携帯・050 は 3-4-4、0120/0800 は 4-3-3、東京(03)・大阪(06) は 2-4-4、それ以外の固定電話は 3-3-4 */
function formatPhone(v){
  const d=String(v||'').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/\D/g,'').slice(0,11);
  if(!d.startsWith('0')) return d;
  let parts;
  if(/^(0[5789]0)/.test(d)) parts=[3,4,4];
  else if(/^(0120|0800)/.test(d)) parts=[4,3,3];
  else if(/^0[36]/.test(d)) parts=[2,4,4];
  else parts=[3,3,4];
  const out=[];let i=0;
  for(const n of parts){ if(i>=d.length) break; out.push(d.slice(i,i+n)); i+=n; }
  if(i<d.length) out.push(d.slice(i));
  return out.join('-');
}
/* 電話番号の欄（type="tel"）は、どこでも入力に合わせてハイフンを入れる */
document.addEventListener('input',e=>{
  const el=e.target;
  if(!el||el.tagName!=='INPUT'||el.type!=='tel') return;
  if(e.inputType&&e.inputType.startsWith('delete')) return;  // 消している途中は整えない
  if(e.isComposing) return;
  const f=formatPhone(el.value);
  if(f!==el.value){ el.value=f; try{ el.setSelectionRange(f.length,f.length); }catch(_){} }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el&&el.tagName==='INPUT'&&el.type==='tel'){ el.value=formatPhone(el.value); }
});
/* 生年月日から年齢を出す */
function ageFrom(birthday){
  const b=new Date(birthday); if(isNaN(b)) return '';
  const t=new Date(); let a=t.getFullYear()-b.getFullYear();
  const m=t.getMonth()-b.getMonth();
  if(m<0||(m===0&&t.getDate()<b.getDate())) a--;
  return a>=0&&a<120 ? String(a) : '';
}

async function doAuth(){
  const email=document.getElementById('auEmail').value.trim();
  const pass=document.getElementById('auPass').value;
  if(!email||!pass){authMsg('メールとパスワードを入力してください','err');return;}
  busyBtn(document.getElementById('authBtn'),true,authMode==='signup'?'登録しています…':'ログインしています…');
  try{
    if(authMode==='signup'){
      const name=document.getElementById('auName').value.trim();
      if(!name){authMsg('お名前を入力してください','err');return;}
      const agreed=termsRead && document.getElementById('auAgree').checked;
      if(!agreed){authMsg(TERMS_TITLE+'をご確認の上、同意にチェックを入れてください','err');return;}
      const { data, error } = await sb.auth.signUp({email,password:pass});
      if(error) throw error;
      /* トレーナーがまだ1人もいなければ、自動でトレーナー（オーナー）になる。
         先にゲスト申込や会員登録があっても、トレーナーがいなければ1人目として扱う */
      const staffTyped=(document.getElementById('auStaff')||{}).value ? document.getElementById('auStaff').value.trim() : '';
      const [isFirst,okCode]=await Promise.all([noTrainerYet(), staffCodeMatches(staffTyped)]);
      /* 合言葉を入れた人はトレーナーとして登録する。合言葉の確認は firestore.rules でも行う */
      const staffCode=(document.getElementById('auStaff')||{}).value ? document.getElementById('auStaff').value.trim() : '';
      const ok=okCode;
      if(staffCode && ok===false){ authMsg('スタッフの合言葉が違います','err'); return; }
      const wantAdmin=isFirst || (!!staffCode && ok!==false);
      const row={ id:data.user.id, name, role:wantAdmin?'admin':'member', tickets:0,
        terms_agreed_at:new Date().toISOString(),
        /* 登録のときに選んだ店舗。決めないと、どの店の予約か分からなくなる */
        store:(USE_STORES?(auStoreId||curStore||DEFAULT_STORE):DEFAULT_STORE),
        /* どこから登録された方か */
        joined_via:'new' };
      if(staffCode && !isFirst) row.staff_code=staffCode;
      try{
        await sb.from('profiles').insert(row);
      }catch(err){
        if(!staffCode || isFirst) throw err;
        /* ルールに弾かれた＝合言葉が違う。会員として登録する */
        await sb.from('profiles').insert({ ...row, role:'member', staff_code:null });
        const { error:e3 } = await sb.auth.signInWithPassword({email,password:pass});
        if(e3){authMsg('合言葉が違うため、会員として登録しました。ログインし直してください。','err');return;}
        await afterLogin();
        toast('合言葉が違うため、会員として登録しました');
        startWizard(emptyIntake(),async d=>{
          await sb.from('intake_sheets').upsert(intakeToRow(d,me.id));
        });
        return;
      }
      /* 合言葉はプロフィールに残さない */
      if(row.staff_code) await sb.from('profiles').update({staff_code:null}).eq('id',data.user.id);
      /* 1人目の登録が終わったら印を付ける。以後トレーナーは合言葉が必要になる */
      if(isFirst) await sb.from('settings').upsert({id:'bootstrap',at:new Date().toISOString(),owner_uid:data.user.id});
      const { error:e2 } = await sb.auth.signInWithPassword({email,password:pass});
      if(e2){authMsg('登録完了。確認メールのリンクを開いてからログインしてください。','ok');return;}
      /* 会員は、登録のあとすぐヒアリングシートに進む（画面の準備は後ろで進める）。書き終えたら会員ページへ */
      const ready=afterLogin();
      if(!wantAdmin){ me=me||data.user; startSignupIntake(); }
      await ready;
    }else{
      const { error } = await sb.auth.signInWithPassword({email,password:pass});
      if(error) throw error;
      await afterLogin();
    }
  }catch(err){
    authMsg(translateErr(err.message),'err');
  }finally{
    busyBtn(document.getElementById('authBtn'),false);
  }
}
function translateErr(m){
  m=String(m||'');
  if(/Invalid login|invalid-credential|invalid-login-credentials|wrong-password|user-not-found/i.test(m))return'メールまたはパスワードが違います';
  if(/already registered|email-already-in-use/i.test(m))return'このメールアドレスは既にご登録済みです。ログイン画面からお入りください';
  if(/at least 6|weak-password/i.test(m))return'パスワードは6文字以上にしてください';
  if(/invalid-email/i.test(m))return'メールアドレスの形式が正しくありません';
  if(/too-many-requests/i.test(m))return'試行回数が多すぎます。しばらく待ってからお試しください';
  if(/requires-recent-login/i.test(m))return'安全のため、いったんログアウトして再ログインしてから変更してください';
  if(/network-request-failed/i.test(m))return'通信エラーです。電波の良い場所でお試しください';
  return m;
}

/* 姿勢分析の記録の読み書き。計測値と AI コメントは posture_records、
   縮小した写真は posture_photos（記録と同じ ID）に分けて置き、一覧を開くときに写真まで読まないようにする。
   user_id が null の記録は「会員と紐付いていない記録」（新規のお客様など）。あとから紐付け直せる */
/* デモのときの姿勢分析の写真。localStorage に入れると容量を使い切って他のデモデータも保存できなくなるので、
   ページを開いている間だけメモリに持つ（タブを行き来しても残る） */
const POSTURE_DEMO_PHOTOS={};
function postureStore(){
  const rows=async q=>{ const {data,error}=await q; if(error) throw error; return data||[]; };
  const recs=()=>sb.from('posture_records').select('*');
  const newest=q=>q.order('date',{ascending:false}).order('created_at',{ascending:false});
  const stamp=()=>new Date().toISOString();
  const memPhotos=DEMO?POSTURE_DEMO_PHOTOS:null;
  const putPhotos=(id,photos)=>memPhotos?(memPhotos[id]=photos):sb.from('posture_photos').upsert({id,record_id:id,...photos});
  return {
    demo:DEMO,
    list:uid=>rows(newest(recs().eq('user_id',uid))),
    unlinked:()=>rows(newest(recs().eq('user_id',null))),
    async save(rec,photos){
      const {data,error}=await sb.from('posture_records').insert({...rec,by:me.id}).select().single();
      if(error) throw error;
      await putPhotos(data.id,photos);
      return data.id;
    },
    async update(id,rec,photos){
      await sb.from('posture_records').update({...rec,by:me.id,updated_at:stamp()}).eq('id',id);
      await putPhotos(id,photos);
    },
    link:(id,uid,name)=>sb.from('posture_records').update({user_id:uid,name,linked_at:stamp()}).eq('id',id),
    async photos(id){
      if(memPhotos) return memPhotos[id]||null;
      const {data}=await sb.from('posture_photos').select('*').eq('id',id).maybeSingle(); return data||null;
    },
    async remove(id){
      if(memPhotos) delete memPhotos[id]; else await sb.from('posture_photos').delete().eq('id',id);
      await sb.from('posture_records').delete().eq('id',id);
    },
  };
}


/* ---------- 日付ユーティリティ ---------- */
const DOW=['日','月','火','水','木','金','土'];
function fmtDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function isWeekday(d){const w=d.getDay();return w>=1&&w<=5;}
/* 何日先まで予約できるか。config.js の bookAheadDays で変えられる */
const BOOK_AHEAD_DAYS = SHOP.bookAheadDays || 31;
/* 今日から calendarDays 日先までの営業日を返す（1ヶ月先まで予約できるよう既定30日） */
function nextDays(calendarDays){
  const out=[];const d=new Date();d.setHours(0,0,0,0);
  for(let i=0;i<calendarDays;i++){
    if(!SETTINGS.weekdaysOnly||isWeekday(d))out.push(new Date(d));
    d.setDate(d.getDate()+1);
  }
  return out;
}
/* 予約枠の間隔（分）。config.js の slotStep。60 なら1時間、30 なら30分刻み */
const SLOT_STEP = Number(SHOP.slotStep) || 60;
const STEP_H = SLOT_STEP/60;
/* 枠の始まりの時刻を並べる。30分刻みなら 8, 8.5, 9 … のように小数で返す */
function slotHours(){
  const a=[];
  for(let h=SETTINGS.openHour; h<SETTINGS.closeHour; h+=STEP_H) a.push(Math.round(h*100)/100);
  return a;
}
/* 10.5 → "10:30" */
function hhmm(h){
  const n=Number(h)||0, H=Math.floor(n), M=Math.round((n-H)*60);
  return H+':'+String(M).padStart(2,'0');
}
function jdate(ds){const [y,m,dd]=ds.split('-');const d=new Date(+y,+m-1,+dd);return `${+m}/${+dd}(${DOW[d.getDay()]})`;}
/* 予約日が今日（当日）かどうか */
function isToday(ds){return ds===fmtDate(new Date());}
/* その枠がもう始まっているか。今日の、今の時刻を過ぎた枠は予約できない */
function isPastSlot(ds,h){
  const now=new Date();
  return isToday(ds) && Number(h) <= now.getHours()+now.getMinutes()/60;
}
/* ---------- お知らせメール ----------
   SHOP.mailEndpoint（mail-worker）に「何が起きたか」だけを知らせる。文面と宛先は mail-worker が決める。
   メールが送れなくても、予約などの操作は止めない */
const MAIL_URL=String(SHOP.mailEndpoint||'').trim();
function sendMail(type,d){
  if(DEMO||!MAIL_URL) return;
  try{
    const u=firebase.auth().currentUser;
    if(!u) return;
    const body={type,userId:d.userId,date:d.date,hour:d.hour,
      trainer:d.trainerId?trainerName(d.trainerId):'',trial:!!d.trial,refund:!!d.refund,
      fromDate:d.fromDate||'',fromHour:d.fromHour,
      store:USE_STORES?storeName(d.store||curStore):''};
    /* Google Apps Script は追加のヘッダを受け取れないので、ログインの証明は本文に入れる。
       Content-Type を text/plain にすると、やり取りが1往復で済む */
    const gas=/script\.google\.com/.test(MAIL_URL);
    u.getIdToken()
      .then(t=>gas
        ? fetch(MAIL_URL,{method:'POST',keepalive:true,
            headers:{'Content-Type':'text/plain;charset=utf-8'},
            body:JSON.stringify(Object.assign({},body,{idToken:t}))})
        : fetch(MAIL_URL,{method:'POST',keepalive:true,
            headers:{'Content-Type':'application/json','Authorization':'Bearer '+t},body:JSON.stringify(body)}))
      .then(res=>{ if(!res.ok) console.warn('お知らせメールを送れませんでした',res.status); })
      .catch(e=>console.warn('お知らせメールを送れませんでした',e));
  }catch(e){ console.warn(e); }
}
/* お知らせメールの宛先。会員はログインのメールをヒアリングシートの記録に残す（本人とトレーナーだけが読める） */
function saveMailAddress(uid,email){
  if(!uid||!email) return Promise.resolve();
  return sb.from('intake_sheets').upsert({user_id:uid,email}).then(()=>{},e=>console.warn(e));
}
/* 取消・変更の締め切り。SHOP.cancelHours があれば開始のその時間前、なければ当日 */
const CANCEL_HOURS=Number(SHOP.cancelHours)||0;
/* 締め切りを過ぎた予約か（取り消してもチケットは戻らない・会員は日時変更できない） */
function pastDeadline(r){
  if(!CANCEL_HOURS) return isToday(r.date);
  const [y,m,d]=String(r.date).split('-').map(Number);
  const hh=Number(r.hour)||0;
  const start=new Date(y,m-1,d,Math.floor(hh),Math.round((hh-Math.floor(hh))*60));
  return start.getTime()-Date.now() < CANCEL_HOURS*3600*1000;
}
/* 締め切りの言い方 */
const LATE_BADGE=CANCEL_HOURS?`${CANCEL_HOURS}時間以内・返却なし`:'当日・返却なし';
const LATE_REASON=CANCEL_HOURS?`開始${CANCEL_HOURS}時間前を過ぎているため`:'当日のため';
const UNTIL=CANCEL_HOURS?`${CANCEL_HOURS}時間前まで`:'前日まで';

/* 日曜は sun、土曜は sat（カレンダーの色分け用） */
function dowClass(i){ return i===0?'sun':i===6?'sat':''; }
/* 月ごとのカレンダー。予約できる日だけ押せる。表示する月は選んでいる日の月 */
/* 日付を選び直したときに、画面の位置が上に戻らないようにする */
function pickDay(ds){
  const y=window.scrollY||window.pageYOffset||0;
  selDate=ds;
  Promise.resolve(render()).then(()=>window.scrollTo(0,y));
}
function monthCal(days, note){
  const ok=new Set(days.map(fmtDate));
  const months=[...new Set(days.map(d=>fmtDate(d).slice(0,7)))];
  const ym=selDate.slice(0,7);
  const mi=months.indexOf(ym);
  const [y,m]=ym.split('-').map(Number);
  const first=new Date(y,m-1,1), last=new Date(y,m,0).getDate();
  const todayS=fmtDate(new Date());
  let cells=DOW.map((w,i)=>`<div class="w ${dowClass(i)}">${w}</div>`).join('');
  for(let i=0;i<first.getDay();i++) cells+='<div></div>';
  for(let d=1;d<=last;d++){
    const ds=`${ym}-${String(d).padStart(2,'0')}`;
    const cls=[ds===selDate?'on':'', ds===todayS?'today':'', dowClass(new Date(y,m-1,d).getDay())].join(' ').trim();
    cells+= ok.has(ds)
      ? `<button class="${cls}" onclick="pickDay('${ds}')">${d}</button>`
      : `<button class="${cls}" disabled>${d}</button>`;
  }
  return `
    <div class="mcal-head">
      <button onclick="calMove(-1)" ${mi<=0?'disabled':''} aria-label="前の月">‹</button>
      <b>${y}年${m}月</b>
      <button onclick="calMove(1)" ${mi<0||mi>=months.length-1?'disabled':''} aria-label="次の月">›</button>
    </div>
    <div class="mcal-grid">${cells}</div>
    <div class="mcal-note">${note||''}</div>`;
}
/* 月を切り替えて、その月で最初に予約できる日を選ぶ */
function calMove(step){
  const days=nextDays(BOOK_AHEAD_DAYS).map(fmtDate);
  const months=[...new Set(days.map(ds=>ds.slice(0,7)))];
  const next=months[months.indexOf(selDate.slice(0,7))+step];
  if(!next) return;
  selDate=days.find(ds=>ds.slice(0,7)===next);
  render();
}

function linkCard(g){

    <div class="small" style="margin-bottom:12px;line-height:1.7">いまはこの端末でだけ、ご予約を確認できます。<br>メールアドレスとパスワードを決めておくと、機種を変えたときや別の端末からでも、ご予約とチケットをご確認いただけます。</div>
